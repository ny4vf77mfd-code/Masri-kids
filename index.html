function audioPool(id){
  const it = ITEM[id], b = baseOf(id);
  const ok = w => w.id!==b && w.pic!==it.pic && isConcrete(w.id) && hasAudio(lid(w.id));
  let pool = WORDS.filter(w=>w.w===it.w && ok(w));
  if(pool.length < 2) pool = pool.concat(WORDS.filter(w=>w.w!==it.w && ok(w)));
  return pool.map(w=>lid(w.id));
}
function lessonWords(world, lesson, p){
  if(lesson.review || lesson.sentencesOnly){
    const all = wordsOfWorld(world.id), pool = all.filter(w=>p.level!==1 || isConcrete(w.id));
    return sample(pool.length ? pool : all, p.level===1 ? 4 : 5);
  }
  return lesson.words.map(id=>ITEM[id]).filter(Boolean);
}
function wordTypeL2(id, i){
  let k = ['translate','meaning','picword','listen-nl'][i%4];
  if(k==='listen-nl' && !hasAudio(id)) k = 'meaning';
  if(k==='picword' && !isConcrete(id)) k = 'translate';
  return k;
}
function buildSteps(wi, li, p){
  const world = WORLDS[wi], lesson = world.lessons[li], lvl = p.level, acc = accuracy(p);
  const ids = lessonWords(world, lesson, p).map(w=>lid(w.id));
  const sents = SENTENCES.filter(s=>(lesson.review||lesson.sentencesOnly) ? s.w===world.id : s.lesson===lesson.id).map(s=>lid(s.id));
  const fresh = ids.filter(id=>!p.words[baseOf(id)]);
  const steps = [{type:'welcome', ids:fresh, title:lesson.title}];
  fresh.forEach(id=>steps.push({type:'intro', id}));
  const body = [];
  let chat = [];
  if(lvl===1){
    const con = ids.filter(isConcrete), abs = ids.filter(id=>!isConcrete(id));
    con.forEach(id=>body.push({type:'listen', id}));
    const pw = con.filter(hasAudio).filter(id=>audioPool(id).length>=2);
    if(pw.length) body.push({type:'picword', id:pick(pw)});
    abs.forEach(id=>body.push({type:'say', id}));
    if(sents.length) body.push({type:'say', id:pick(sents)});
    if(con.length>=2) body.push({type:'memory', ids:sample(con, Math.min(4, con.length))});
  } else {
    ids.forEach((id,i)=>body.push({type:wordTypeL2(id,i), id}));
    if(ids.length>=3) body.push({type:'match', ids:sample(ids, Math.min(4, ids.length))});
    const sn = sample(sents, (lesson.review||lesson.sentencesOnly) ? 3 : 2);
    sn.forEach((sid,i)=>body.push({type: (i%2===1 && !(acc!==null && acc<0.6)) ? 'fill' : 'build', id:sid}));
    if(!sn.length && ids.length>=2) body.push({type:'memory', ids:sample(ids, Math.min(4, ids.length))});
    const dl = DIALOGS[world.id];
    if(dl && (lesson.review || lesson.sentencesOnly || li>=2)){ const d = pick(dl); chat = d.turns.map((t,k)=>({type:'chat', turns:d.turns, intro:d.intro, t:k})); }
    if(sents.length) body.push({type:'say', id:pick(sents)});
  }
  // herhaling van woorden uit eerdere lessen (moeilijke woorden komen vaker terug)
  const own = ids.map(baseOf);
  const rev = dueWords(p, lvl).filter(id=>!own.includes(id)).slice(0, 2).map(id=>{ const x = lid(id); return {type: lvl===1 ? 'listen' : wordTypeL2(x, Math.floor(Math.random()*4)), id:x, review:true}; });
  // korte toets aan het eind
  const tpool = lvl===1 ? ids.filter(isConcrete) : ids;
  const test = sample(tpool, lvl===1 ? 2 : 3).map((id,i)=>({type: lvl===1 ? 'listen' : ['listen-nl','translate','picword'][i%3], id, test:true}))
    .map(t=>{ if(t.type==='listen-nl' && !hasAudio(t.id)) t.type='meaning'; if(t.type==='picword' && (!isConcrete(t.id))) t.type='translate'; return t; });
  return steps.concat(shuffle(body), chat, rev, test);
}
function startLesson(wi, li){
  const p = me();
  L = { wi, li, lesson: WORLDS[wi].lessons[li], steps: buildSteps(wi,li,p), i:0, mistakes:0, xp:0, state:'answer', sel:null, ok:null, retried:new Set(), t0:Date.now(), answered:0, correct:0 };
  S.screen='lesson'; window.scrollTo(0,0); render(); autoPlay();
}
function startReview(){
  const p = me(); if(!p) return;
  let ids = dueWords(p, p.level).slice(0, 8);
  if(ids.length < 4){
    const extra = Object.entries(p.words||{}).filter(([id,x])=>ITEM[id] && ITEM[id].kind==='word' && ((x.c||0)+(x.w||0))>0 && !ids.includes(id) && (p.level!==1 || isConcrete(id)))
      .sort((a,b)=>((b[1].w||0)-(b[1].c||0))-((a[1].w||0)-(a[1].c||0))).map(([id])=>id);
    ids = ids.concat(extra).slice(0, 6);
  }
  if(!ids.length){ toast('Nog niets om te herhalen. Speel eerst een les!'); return; }
  ids = ids.map(lid);
  const steps = [{type:'welcome', ids:[], srs:true, count:ids.length, title:'Herhalen'}];
  ids.forEach((id,i)=>steps.push(p.level===1 ? {type: isConcrete(id) ? 'listen' : 'say', id} : {type:wordTypeL2(id,i), id}));
  const con = ids.filter(isConcrete);
  if(p.level===1 && con.length>=2) steps.splice(3, 0, {type:'memory', ids:sample(con, Math.min(4, con.length))});
  if(p.level!==1 && ids.length>=3) steps.splice(3, 0, {type:'match', ids:sample(ids, Math.min(4, ids.length))});
  L = { wi:null, li:null, lesson:{id:'srs', title:'Herhalen', icon:'🔁', srs:true}, steps, i:0, mistakes:0, xp:0, state:'answer', sel:null, ok:null, retried:new Set(), t0:Date.now(), answered:0, correct:0 };
  S.screen='lesson'; window.scrollTo(0,0); render(); autoPlay();
}
function autoPlay(){
  const st = L && L.steps[L.i]; if(!st) return;
  if(st.type==='welcome'){ const p = me(); if(voiceOn()) later(()=>speakNL('Hoi '+p.name+'! '+(st.srs?'We gaan herhalen wat je al kent.':'We gaan leren. Luister goed!')), 300); return; }
  const word = ['intro','listen','meaning','say','listen-nl'].includes(st.type) && hasAudio(st.id);
  if(voiceOn() && INSTR[st.type]) later(()=>speakNL(INSTR[st.type], ()=>{ if(word) play(st.id,true); }), 300);
  else if(word) later(()=>play(st.id,true), 350);
  else if(st.type==='chat'){ const q = res(st.turns[st.t].q); if(hasAudio(q)) later(()=>play(q,true), 350); }
}

    case 'memory': {
      if(!st.cards){ st.cards = shuffle(st.ids.flatMap(id=>[{k:id,t:'pic'},{k:id,t:'txt'}])); st.open=[]; st.matched=[]; }
      const kid = isKid();

      <div class="memgrid">${st.cards.map((c,i)=>{
        const w = ITEM[c.k]; const cls = st.matched.includes(i)?'matched':st.open.includes(i)?'open':'';
        const back = c.t==='pic' ? `<span class="pic">${picOf(w.id)}</span>` : (kid && hasAudio(w.id) ? `<span class="aicon big">${ICON_SPK}</span>` : `<span class="ph">${esc(w.ph)}</span><span class="ar" lang="ar">${w.ar}</span>`);
        return `<button class="mcard ${cls}" data-act="mem:${i}" aria-label="Kaart ${i+1}"><span class="in"><span class="f">?</span><span class="b">${back}</span></span></button>`;
      }).join('')}</div>`;
    }
    case 'say': return `${chips(st)}
      <p class="ex-k">Zeg het hardop!<small>Luister eerst, en zeg het dan zelf na.</small></p>
      <div class="wordcard saycard pop">
        <div class="pic">${picOf(it.id)}</div>

        <div class="nl">${esc(it.nl)}</div>
        ${playBtn(st.id,'big')}
      </div>
      <div class="bubble-row">${mascot(64,'wow','')}<div class="bubble">Ik luister mee! Zeg het lekker hard 🎤</div></div>`;
  }
}
function optCls(st,o){
  if(L.state==='feedback'){ if(o===st.id) return 'right'; if(o===L.sel) return 'wrong'; return ''; }
  return L.sel===o ? 'sel' : '';
}
function fillCls(st,k){
  if(L.state==='feedback'){ if(st.choices[k]===st.answer) return 'right'; if(k===L.sel) return 'wrong'; return ''; }
  return L.sel===k ? 'sel' : '';
}
function praise(){
  const p = me();
  const opts = [['Brafo!','Goed zo!'],['Goed zo!','Super!'],['Mabrook!','Gefeliciteerd!'],['Gamed!','Te gek!']];
  if(p.gender==='m') opts.push(['Sjaater!','Knap gedaan!']);
  if(p.gender==='f') opts.push(['Sjaatra!','Knap gedaan!']);

function answer(ok){
  const st = L.steps[L.i];
  L.ok = ok; L.state='feedback';
  sfx(ok?'ok':'bad');
  if(voiceOn()) later(()=>speakNL(ok ? pick(PRAISE_NL) : 'Bijna! Luister nog eens.', ()=>{ if(hasAudio(st.id)) play(st.id,true); }), 350);
  if(ok){ L.xp += 2; L.praise = praise(); if(st.id) record(st.id,true); }
  else {
    L.mistakes++; if(st.id) record(st.id,false);
    if(!L.retried.has(L.i) && st.type!=='chat'){ L.retried.add(L.i); L.steps.push({type:st.type, id:st.id, ids:st.ids}); }
  }

}
function check(){
  const st = L.steps[L.i];
  if(st.type==='build') answer(st.ans.map(ti=>st.tiles[ti].ph).join(' ') === ITEM[st.id].ph);
  else if(st.type==='fill') answer(st.choices[L.sel]===st.answer);
  else answer(L.sel===st.id);
  if(L.ok && hasAudio(st.id) && !voiceOn() && st.type!=='picword') play(st.id,true);
}
function next(){
  const st = L.steps[L.i];

  hush();

  if(SELF.url){ try{ URL.revokeObjectURL(SELF.url); }catch(e){} SELF.url = null; }
  if(L.i >= L.steps.length) return finishLesson();
  window.scrollTo(0,0); render(); autoPlay();
}
function matchTap(side, id){
  const st = L.steps[L.i]; if(L.state!=='answer' || st.done.includes(id)) return;
  if(side==='l'){ st.selL = id; render(); return; }
  play(id, true);
  if(!st.selL){ render(); return; }
  if(st.selL===id){
    st.done.push(id); st.selL = null; record(id, true); sfx('match');
    if(st.done.length===st.ids.length){ L.xp += 4; L.ok = true; L.state = 'feedback'; L.praise = praise(); }
    render();
  } else {
    st.bad = [st.selL, id]; if(!st.missed){ st.missed = true; L.mistakes++; } record(st.selL, false); sfx('bad'); render();
    setTimeout(()=>{ st.bad = null; st.selL = null; render(); }, 650);
  }
}
function memTap(i){
  const st = L.steps[L.i];
  if(st.matched.includes(i) || st.open.includes(i) || st.open.length===2) return;
  st.open.push(i); const c = st.cards[i]; sfx('flip');
  if(c.t==='txt') play(c.k,true);
  render();
  if(st.open.length===2){
    const [a,b] = st.open.map(k=>st.cards[k]);
    if(a.k===b.k && a.t!==b.t){
      st.matched.push(...st.open); st.open=[]; record(a.k,true); setTimeout(()=>sfx('match'),150);
      setTimeout(()=>{ if(st.matched.length===st.cards.length){ const p=me(); daily(p); p.today.memory++; L.xp+=4; L.ok=true; L.state='feedback'; L.praise=praise(); } render(); }, 350);
    } else setTimeout(()=>{ st.open=[]; render(); }, 900);
  }
}

function addTime(p, t0){

  const sec = Math.max(0, Math.min(900, Math.round((Date.now()-t0)/1000)));

  const keys = Object.keys(p.time).sort(); while(keys.length > 90) delete p.time[keys.shift()];

}

    p.lessons[lid0] = Math.max(p.lessons[lid0]||0, stars);
    if(!p.best[lid0] || L.mistakes < p.best[lid0].mistakes) p.best[lid0] = {stars, mistakes:L.mistakes, date:today()};
  } else p.reviews = (p.reviews||0) + 1;

  const t = today();
  if(p.last !== t){ p.streak = (p.last===yesterday()) ? (p.streak||0)+1 : 1; p.last = t; if(!p.days.includes(t)) p.days.push(t); }

  if(firstTime && STICKERS[idx] && !p.stickers.includes(idx)){ p.stickers.push(idx); sticker = STICKERS[idx]; }

  const worldDone = !!(w && firstTime && w.lessons.every(l=>p.lessons[l.id]));
  const nxt = w ? WORLDS.findIndex((x,i)=>!x.bonus && prevWorld(p,i)===L.wi) : -1;
  const unlockedNext = !!(w && firstTime && nxt>=0 && w.lessons.filter(l=>p.lessons[l.id]).length===3);
  if(worldDone) xp += 50;
  // dagelijkse uitdaging
  daily(p); p.today.lessons++; p.today.xp += xp;
  let dailyBonus = false;
  const d2 = daily(p);
  if(!p.today.claimed && p.today[d2.k] >= d2.n){ p.today.claimed = true; xp += 20; p.today.xp += 20; dailyBonus = true; }

  const gAfter = goalState(p), fAfter = familyState();

function penPool(p){
  let pool = Object.keys(p.words||{}).filter(id=>ITEM[id] && ITEM[id].kind==='word' && (p.level!==1 || isConcrete(id)));
  if(pool.length < 6) pool = pool.concat(p.level===1 ? [...WORLDS[2].lessons[0].words, ...WORLDS[1].lessons[0].words] : [...WORLDS[0].lessons[0].words, ...WORLDS[3].lessons[0].words]);
  return [...new Set(pool)];
}
const byId = id => DB.profiles.find(x=>x.id===id);
function startPenalty(opp){

  const players = [p.id]; if(opp && opp!==p.id && byId(opp)) players.push(opp);
  const qs = {}; players.forEach(id=>{ qs[id] = sample(penPool(byId(id)), 5); });
  const order = []; for(let k=0;k<5;k++) players.forEach(id=>order.push(id));
  PEN = { players, order, qs, i:0, res:[], state: players.length>1 ? 'turn' : 'q', sel:null, opts:null, xp:{}, home:p.id, t0:Date.now() };
  players.forEach(id=>PEN.xp[id]=0);

function penShotNo(i){ const who = PEN.order[i]; return PEN.order.slice(0,i).filter(x=>x===who).length; }
function penCur(){ return PEN.qs[PEN.order[PEN.i]][penShotNo(PEN.i)]; }

function penShoot(o){
  if(!PEN || PEN.state!=='q') return;
  const id = penCur(), ok = o===id, who = PEN.order[PEN.i];
  PEN.sel = o; PEN.state='shot'; PEN.res[PEN.i] = ok; record(id, ok);
  if(ok){ PEN.xp[who] += 3; if(hasAudio(id) && !voiceOn()) play(id,true); }
  render();
  setTimeout(()=>sfx(ok?'goal':'bad'), 520);
  if(voiceOn()) later(()=>speakNL(ok?'Goal! Goed zo!':'Gered! Luister nog eens.', ()=>{ if(hasAudio(id)) play(id,true); }), 900);
  const side = pick(['L','R','C']);
  const bx = {L:'27%',R:'73%',C:'50%'}[side], by = side==='C' ? '30%' : '34%';
  setTimeout(()=>{
    const ball = $('#pen-ball'), kp = $('#pen-keeper'); if(!ball||!kp) return;
    ball.style.left = bx; ball.style.top = ok ? by : '50%'; ball.style.transform = 'translate(-50%,-50%) scale(.62) rotate(540deg)';
    if(ok){ const ks = side==='L' ? '70%' : side==='R' ? '30%' : pick(['30%','70%']); kp.style.left = ks; kp.style.transform = `translateX(-50%) rotate(${parseFloat(ks)<50?-55:55}deg)`; }
    else { kp.style.left = bx; kp.style.transform = `translateX(-50%) rotate(${side==='L'?-25:side==='R'?25:0}deg)`; }
  }, 40);
  setTimeout(()=>{ const c=$('#pen-call'), f=$('#pen-fb'); if(c) c.classList.add('show'); if(f) f.classList.add('show'); if(ok) confetti(35); }, 600);
}
function penNext(){
  hush();
  PEN.i++; PEN.sel=null; PEN.opts=null;
  if(PEN.i >= PEN.order.length){
    PEN.state = 'end';
    let winner = null;
    if(isDuel()){ const [a,b] = PEN.players, ga = penGoals(a), gb = penGoals(b); if(ga!==gb) winner = ga>gb ? a : b; }
    PEN.players.forEach(id=>{
      const pl = byId(id); if(!pl) return;
      daily(pl); pl.xp += PEN.xp[id]; pl.today.xp += PEN.xp[id];
      const d = daily(pl);
      if(!pl.today.claimed && pl.today[d.k] >= d.n){ pl.today.claimed = true; pl.xp += 20; pl.today.xp += 20; }
      const w = wk(pl), g = penGoals(id); w.goals += g; w.best = Math.max(w.best, g);
      if(id===winner) w.duelsWon++;
      const got = checkBadges(pl, {pen5: g===5, duelWin: id===winner});
      if(got.length) setTimeout(()=>toast(pl.name+': nieuwe badge '+got.map(b=>b.e+' '+b.n).join(', ')), 900);
    });
    addTime(byId(PEN.home), PEN.t0);
    penEndRestore();
    save(); render(); sfx('goal');
    if(isDuel() || penGoals(PEN.players[0])>=4) confetti(70);
    return;
  }
  DB.activeId = PEN.order[PEN.i];
  PEN.state = isDuel() ? 'turn' : 'q';
  render();
  if(PEN.state==='q') penAuto(); else penTurnVoice();
}

function adultLessons(m){
  const g = []; for(let i=0;i<m.items.length;i+=4) g.push(m.items.slice(i,i+4));
  if(g.length>1 && g[g.length-1].length<3){ const last = g.pop(); g[g.length-1] = g[g.length-1].concat(last); }
  return g;
}
const modLessonIds = m => adultLessons(m).map((_,k)=>`${m.id}-L${k+1}`);
function modProgress(p, m){ const ids = modLessonIds(m).concat((m.scn||[])); const d = ids.filter(id=>(p.lessons||{})[id]).length; return {d, n:ids.length}; }
function levelProgress(p, lv){ return ADULT_MODS.filter(m=>m.lv===lv).reduce((a,m)=>{ const x = modProgress(p,m); return {d:a.d+x.d, n:a.n+x.n}; }, {d:0,n:0}); }
function nextAdultLesson(p){
  for(const m of ADULT_MODS.filter(x=>x.lv>=(p.alevel||1)).concat(ADULT_MODS.filter(x=>x.lv<(p.alevel||1)))){
    const ids = modLessonIds(m); const k = ids.findIndex(id=>!(p.lessons||{})[id]);
    if(k>=0) return {m, k};
    const s = (m.scn||[]).find(id=>!(p.lessons||{})[id]); if(s) return {m, scn:s};
  }

}

function startAdultLesson(mid, k){

  L = { wi:null, li:null, lesson:{id:`${m.id}-L${k+1}`, title:`${m.title} · les ${k+1}`, adult:true, group:m.title}, steps:steps.concat(shuffle(body), rev), i:0, mistakes:0, xp:0, state:'answer', sel:null, ok:null, retried:new Set(), t0:Date.now(), answered:0, correct:0 };

/* =====================================================================
   AI-TAALPARTNER (Mishmish voor kinderen 7-9, Salma voor volwassenen)
   De app praat alleen met onze eigen server-functie 'ai-chat' op Supabase.
   Daar staat de API-sleutel en daar worden personage, niveau en veiligheid bepaald.
   Spraak: invoer via de spraakherkenning van de browser (als die Egyptisch ondersteunt).
   Gesproken AI-antwoorden: komen later via AI_VOICE (nu uit, zie aiSpeak).
   ===================================================================== */
const AI = { enabled:null, st:null, test:null, testing:false, ratings:{}, reveal:false, sp:{stt:[], tts:{}} };
const AI_VOICE = { enabled:false };                 // later: tekst-naar-spraak voor AI-antwoorden
function aiSpeak(turn){ if(!AI_VOICE.enabled) return; /* aansluitpunt voor een spraakprovider */ }
const STT = window.SpeechRecognition || window.webkitSpeechRecognition || null;
const KID_SCENES = [['animals','🐾','Dieren'],['food','🍞','Eten en drinken'],['football','⚽','Voetbal'],['family','👨‍👩‍👧','Familiewoorden'],['colors','🎨','Kleuren en cijfers']];
const ADULT_SCENES = () => [['free','☕','Vrij gesprek'], ...SCENARIOS.map(x=>[x.id, x.who, x.title])];
// toegang: sleutel ingesteld + (geactiveerd voor deze doelgroep of beheerder in proefmodus) + bij kinderen: 7-9 en toestemming van een ouder
const aiKidAge = p => p.kind ? p.kind==='k2' : p.level===2;
const aiActiveFor = p => !!AI.st && (p.track==='adult' ? AI.st.active_adult : AI.st.active_kids);
const aiCan = p => !!p && AI.enabled===true && (aiActiveFor(p) || AUTH.admin) && (p.track==='adult' || (aiKidAge(p) && p.aiAllowed===true));
const aiName = p => p.track==='adult' ? 'Salma' : 'Mishmish';
async function aiCall(body){
  if(!sb) throw new Error('offline');
  const {data, error} = await sb.functions.invoke('ai-chat', {body});
  if(error){ let msg = 'De taalpartner reageert even niet. Probeer het zo nog eens.';
    try{ const j = await error.context.json(); if(j && j.error) msg = j.error==='not_configured' ? 'De taalpartner is nog niet ingesteld.' : j.error; }catch(e){}
    throw new Error(msg); }
  return data;
}
async function aiStatus(){ try{ const d = await aiCall({action:'status'}); AI.st = d; AI.enabled = !!d.configured; }catch(e){ AI.enabled = false; AI.st = null; } if(!busyScreen()) render(); }
function aiNorm(t){
  const n = x => x && x.ph ? {...x, ph:translit(x.ph, x.ar)} : x;
  if(!t) return t;
  return {...t, reply:n(t.reply), suggestions:(t.suggestions||[]).map(n), new_words:(t.new_words||[]).map(n),
    correction: t.correction && (t.correction.better_ar||t.correction.better_ph) ? {...t.correction, better_ph: translit(t.correction.better_ph||'', t.correction.better_ar||'')} : null};
}
function knownWords(p){
  return Object.entries(p.words||{}).filter(([id,x])=>ITEM[id] && (x.c||0)>=1).sort((a,b)=>(b[1].c||0)-(a[1].c||0)).slice(0,60)
    .map(([id])=>{ const it = ITEM[lid(id)] || ITEM[id]; return {ar:it.ar, ph:it.ph, nl:ITEM[id].nl}; });
}
function talkStart(scene){
  const p = me(); S.talk = {scene, msgs:[], busy:true, err:null, t0:Date.now(), words:[], sent:0, showNl:p.track!=='adult'};
  S.screen = 'talk'; render(); aiSend('', {start:true});
}
async function aiSend(text, opt={}){
  const p = me(), T = S.talk; if(!T || (T.busy && !opt.start)) return;
  if(text) { T.msgs.push({role:'me', text, explain:!!opt.explain}); T.sent++; }
  T.busy = true; T.err = null; render(); talkScroll();
  const history = T.msgs.slice(0, text ? -1 : undefined).filter(m=>!m.local).map(m=> m.role==='me' ? {role:'user', text:m.text} : {role:'assistant', text: m.turn.reply.ar + ' (' + m.turn.reply.ph + ')'});
  try{
    const d = await aiCall({action:'chat', player_id:p.id, scene:T.scene, message:text, start:!!opt.start, explain_nl:!!opt.explain, history, known_words:knownWords(p)});
    if(S.talk!==T) return;
    const turn = aiNorm(d.turn);
    if(turn.correction && text){ const last = T.msgs[T.msgs.length-1]; if(last && last.role==='me') last.corr = turn.correction; }
    T.msgs.push({role:'ai', turn});
    (turn.new_words||[]).forEach(w=>{ if(!T.words.find(x=>x.ar===w.ar)) T.words.push(w); });
    aiSpeak(turn);
  }catch(e){ if(S.talk!==T) return; T.err = e.message; if(text){ T.msgs.pop(); T.sent--; T.retry = {text, opt}; } else T.retry = {text:'', opt}; }
  T.busy = false; render(); talkScroll();
}
function talkScroll(){ requestAnimationFrame(()=>{ const el = $('.talk-log'); if(el) el.scrollTop = el.scrollHeight; window.scrollTo(0, document.body.scrollHeight); }); }
function talkEnd(){
  const p = me(), T = S.talk; if(!T) { S.screen='home'; return; }
  const xp = Math.min(20, T.sent*2);
  if(T.sent){ daily(p); p.xp += xp; p.today.xp += xp; addTime(p, T.t0);
    p.ai = p.ai || {sessions:0, msgs:0};
    p.ai.sessions++; p.ai.msgs += T.sent; p.ai.last = today();
    if(p.track!=='adult'){ p.aiLog = (p.aiLog||[]).concat({d:today(), scene:T.scene, msgs:T.msgs.map(m=> m.role==='me' ? {r:'me', t:m.text} : {r:'ai', t:m.turn.reply.ph, nl:m.turn.reply.nl, adult:!!m.turn.needs_adult})}).slice(-10); }
    p.hist = (p.hist||[]).concat({d:today(), t:'Gesprek met '+aiName(p), w:'Taalpartner', ok:T.sent, n:T.sent, st:0, s:Math.round((Date.now()-T.t0)/1000)}).slice(-40);
    save(); toast(`Goed gepraat! +${xp} XP`); }
  stopListen(); S.talk = null; S.screen = 'home';
}
function saveAiWord(i){
  const p = me(), w = S.talk && S.talk.words[i]; if(!w) return;
  p.aiWords = p.aiWords || [];
  if(!p.aiWords.find(x=>x.ar===w.ar)){ p.aiWords.unshift({...w, d:today()}); p.aiWords = p.aiWords.slice(0,300); save(); toast('Bewaard in je woordenboek'); }
}
// spraakherkenning (alleen als de browser het kan; anders geen knop)
let REC2 = null;
function listen(){
  if(!STT) return;
  if(REC2){ stopListen(); render(); return; }
  try{
    REC2 = new STT(); REC2.lang = 'ar-EG'; REC2.interimResults = true; REC2.maxAlternatives = 1;
    REC2.onresult = e=>{ const txt = [...e.results].map(r=>r[0].transcript).join(' '); const el = $('#talk-in'); if(el) el.value = txt; };
    REC2.onerror = e=>{ const m = e.error==='not-allowed' ? 'Sta de microfoon toe voor deze website.' : e.error==='no-speech' ? 'Ik hoorde niets. Probeer het nog eens.' : e.error==='language-not-supported' ? 'Deze browser herkent geen Egyptisch Arabisch. Typ je antwoord.' : 'Spraakherkenning lukte niet. Typ je antwoord.'; toast(m); };
    REC2.onend = ()=>{ REC2 = null; render(); const el = $('#talk-in'); if(el && el.value) el.focus(); };
    REC2.start(); render();
  }catch(e){ REC2 = null; toast('Spraakherkenning lukte niet. Typ je antwoord.'); }
}
function stopListen(){ try{ if(REC2) REC2.stop(); }catch(e){} }

function talkCardHTML(p, cls=''){

function spListen(i){
  if(!STT) return;
  if(REC2){ stopListen(); return; }
  const want = ITEM[SPEECH_SENTS[i]].ar;
  try{
    REC2 = new STT(); REC2.lang = 'ar-EG'; REC2.interimResults = false; REC2.maxAlternatives = 1; AI.sp.on = i;
    REC2.onresult = e=>{ const heard = [...e.results].map(r=>r[0].transcript).join(' '); AI.sp.stt[i] = {id:SPEECH_SENTS[i], heard, score:wordScore(heard, want)}; };
    REC2.onerror = e=>{ AI.sp.stt[i] = {id:SPEECH_SENTS[i], heard:'', score:0, error:e.error}; if(e.error==='not-allowed') toast('Sta de microfoon toe voor deze website.'); };
    REC2.onend = ()=>{ REC2 = null; AI.sp.on = null; render(); };
    REC2.start(); render();
  }catch(e){ REC2 = null; AI.sp.on = null; toast('Spraakherkenning lukte niet op dit apparaat.'); }
}

/* ---------- foto's in één keer toevoegen (koppeling op exacte bestandsnaam = woord-code) ---------- */
// otta.jpg → woord 'otta'. Alleen woorden krijgen een beeld; zinnen worden overgeslagen.
// Audio en voortgang worden hier nooit aangeraakt.
const IMG_EXT = /\.(jpe?g|png|webp|heic|heif|gif)$/i;
function pbulkPlan(files){
  const words = new Map(WORDS.map(w=>[w.id.toLowerCase(), w.id]));
  const lines = new Set([...SENTENCES, ...DLINES].map(x=>x.id.toLowerCase()));
  const seen = new Set();
  return [...files].sort((a,b)=>a.name.localeCompare(b.name,'nl',{numeric:true})).map(f=>{
    const base = f.name.replace(/\.[^.]+$/,'').trim().toLowerCase();
    const row = {file:f, name:f.name, id:null, state:'skip', reason:'', url:null};
    if(!IMG_EXT.test(f.name)) row.reason = 'Geen afbeelding';
    else if(seen.has(base)) row.reason = 'Dubbel: dit woord staat al eerder in de lijst';
    else if(words.has(base)){ row.id = words.get(base); row.state = PICS[row.id] ? 'replace' : 'new'; seen.add(base); }
    else if(lines.has(base)) row.reason = 'Dit is een zin; daar is geen beeld nodig';
    else row.reason = 'Geen woord met deze bestandsnaam';
    if(row.id) row.url = URL.createObjectURL(f);
    return row;
  });
}
function pbulkClose(){ if(S.pbulk) S.pbulk.rows.forEach(r=>{ if(r.url) try{ URL.revokeObjectURL(r.url); }catch(e){} }); S.pbulk = null; }
async function pbulkSave(){
  const B = S.pbulk; if(!B || B.busy) return;
  B.busy = true; B.done = 0; render();
  for(const r of B.rows.filter(x=>x.id)){
    const res = await savePic(r.id, r.file);
    r.result = res==='ok' ? 'ok' : 'fail'; if(res!=='ok') r.err = LAST_ERR;
    B.done++; render();
  }
  B.busy = false; B.finished = true;
  const ok = B.rows.filter(r=>r.result==='ok').length, bad = B.rows.filter(r=>r.result==='fail').length;
  toast(bad ? `${ok} foto's opgeslagen, ${bad} mislukt` : `${ok} foto's opgeslagen`); render();
}

function authErr(e){
  const m = String(e && e.message || '').toLowerCase();
  if(m.includes('invalid login')) return 'E-mailadres of wachtwoord klopt niet.';
  if(m.includes('not confirmed')) return 'Bevestig eerst je e-mailadres via de link in je mail.';
  if(m.includes('already registered') || m.includes('already been registered')) return 'Dit e-mailadres heeft al een account. Log in.';
  if(m.includes('password') && (m.includes('least') || m.includes('weak') || m.includes('short'))) return 'Kies een sterker wachtwoord van minstens 8 tekens.';
  if(m.includes('rate') || m.includes('too many')) return 'Te veel pogingen. Wacht een paar minuten en probeer het opnieuw.';
  if(m.includes('fetch') || m.includes('network')) return 'Geen verbinding. Controleer je internet.';
  return 'Dat lukte niet: ' + (e && e.message || 'onbekende fout');
}

async function authSubmit(){
  const A = S.auth; if(A.busy) return;
  const email = ($('#a-email') ? $('#a-email').value : A.email || '').trim();
  const pass = $('#a-pass') ? $('#a-pass').value : '';
  A.email = email; A.msg = '';
  if(A.mode!=='newpass' && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ A.msg = 'Vul een geldig e-mailadres in.'; render(); return; }
  if(A.mode!=='reset' && pass.length < (A.mode==='login' ? 1 : 8)){ A.msg = A.mode==='login' ? 'Vul je wachtwoord in.' : 'Kies een wachtwoord van minstens 8 tekens.'; render(); return; }
  if(A.mode==='signup' && !$('#a-ok').checked){ A.msg = 'Vink aan dat je ouder of verzorger bent en toestemming geeft.'; render(); return; }
  A.busy = true; render();
  try{
    if(A.mode==='login'){ const {error} = await sb.auth.signInWithPassword({email, password:pass}); if(error) throw error; }
    else if(A.mode==='signup'){ const {data, error} = await sb.auth.signUp({email, password:pass, options:{emailRedirectTo: location.origin}}); if(error) throw error; if(!data.session){ A.mode='sent'; A.reset=false; } }
    else if(A.mode==='reset'){ const {error} = await sb.auth.resetPasswordForEmail(email, {redirectTo: location.origin}); if(error) throw error; A.mode='sent'; A.reset=true; }
    else if(A.mode==='newpass'){ const {error} = await sb.auth.updateUser({password:pass}); if(error) throw error; A.mode='login'; toast('Nieuw wachtwoord opgeslagen'); S.screen = me() ? 'home' : 'profiles'; }
  }catch(e){ A.msg = authErr(e); }
  A.busy = false; render();
}
let loadedFor = null;
async function onSession(session){
  const u = session && session.user || null;
  AUTH.user = u; AUTH.ready = true;
  if(!u){
    loadedFor = null; DB = EMPTY_DB(); MEDIA.audio = {}; MEDIA.shared = {}; try{ localStorage.removeItem(LSM); }catch(e){} [PICS, PICF, PICSH].forEach(o=>Object.keys(o).forEach(k=>delete o[k])); AUTH.admin = false;
    if(S.screen!=='splash') S.screen = 'auth';
    render(); return;
  }
  if(loadedFor === u.id){ if(S.screen==='loading') S.screen = me() ? 'home' : 'profiles'; render(); return; }
  loadedFor = u.id;
  const wasSplash = S.screen==='splash';
  if(!wasSplash) { S.screen = 'loading'; render(); }
  const had = restoreMedia(u.id);
  const media = loadMedia().then(()=>{ if(had && !busyScreen() && S.screen!=='loading') render(); warmAll(); }).catch(()=>{});
  if(had) warmAll();
  await Promise.all([loadFamily(), checkAdmin(), loadContent(), had ? null : media]);
  aiStatus();
  if(S.auth.mode==='newpass'){ S.screen = 'auth'; }
  else if(!wasSplash) S.screen = me() ? 'home' : 'profiles';
  render();
}

function autoAssign(files){
  const norm = t => String(t).toLowerCase().normalize('NFD').replace(/[^a-z0-9]/g,'');
  const items = [...WORDS,...SENTENCES], used = new Set();
  const out = files.map(f=>{ const base = norm(f.name.replace(/\.[^.]+$/,''));
    const m = base && items.find(x=>!used.has(x.id) && (norm(x.id)===base || norm(x.ph)===base || norm(x.nl)===base));
    if(m){ used.add(m.id); return m.id; } return ''; });
  const queue = [...WORDS.filter(w=>w.w===S.filterW),...SENTENCES.filter(x=>x.w===S.filterW)].filter(x=>!hasAudio(x.id) && !used.has(x.id));
  return out.map(v=> v || (queue.length ? queue.shift().id : ''));
}
function closeBulk(){ if(S.bulk) S.bulk.urls.forEach(u=>{ try{URL.revokeObjectURL(u);}catch(e){} }); S.bulk=null; }
async function bulkSave(){
  const B = S.bulk; if(!B || B.busy) return;
  B.busy = true; B.done = 0; B.status = []; render();
  for(let i=0;i<B.files.length;i++){
    const id = B.assign[i]; if(!id) continue;
    const f = B.files[i];
    B.status[i] = f.size > 3e6 ? 'too_large' : await saveAudio(id, f);
    B.done++; render();
  }
  B.busy = false;
  const ok = B.status.filter(x=>x==='cloud'||x==='local').length;
  const bad = B.status.filter(x=>x==='fail'||x==='too_large').length;
  toast(bad ? `${ok} opgeslagen, ${bad} niet gelukt (${LAST_ERR})` : `${ok} opname${ok===1?'':'s'} opgeslagen`);
  if(!bad) closeBulk();
  render();
}

  const el = e.target.closest('[data-act]'); if(!el) return;

  const p = me();
  switch(act){
    case 'start': if(!AUTH.ready) return; S.screen = !AUTH.user ? 'auth' : (loadedFor ? (me() ? 'home' : 'profiles') : 'loading'); break;
    case 'reload': location.reload(); return;

    case 'go': if(a==='talk'){ S.talk=null; } if(S.screen==='talk' && a!=='talk'){ stopListen(); S.talk=null; } if(S.screen==='penalty'){ penEndRestore(); PEN=null; } if(a==='gate') S.gate=null; if(a==='profiles') S.newP=null; if(S.recS && a!=='parent'){ S.recS=null; recRelease(); }
      S.screen=a; S.confirmDel=false; window.scrollTo(0,0); break;
    case 'duel': startPenalty(a); return;
    case 'pen-ready': if(PEN){ PEN.state='q'; render(); penAuto(); } return;
    case 'rec': if(hasAudio(a) && !REC.mr && S.confirmRec!==a){ S.confirmRec = a; toast('Er is al een opname. Tik nog een keer om hem te vervangen.'); break; } S.confirmRec = null; recToggle(a); return;
    case 'rec-start': { const q = GROUPS().filter(w=>!a || String(w.id)===a).flatMap(w=>allItems().filter(x=>worldOfItem(x)===w.id && !hasAudio(x.id))).map(x=>x.id); if(!q.length) return; S.recS = {queue:q, i:0}; window.scrollTo(0,0); break; }
    case 'cf': S.cf = a; S.cq = ''; S.climit = 40; S.cedit = null; break;
    case 'cmore': S.climit = (S.climit||40) + 40; break;
    case 'cedit': S.cedit = a; S.cnew = null; break;
    case 'cedit-cancel': S.cedit = null; break;
    case 'cok': saveContent(a, {verified:true}).then(ok=>{ if(ok){ toast('Gemarkeerd als gecontroleerd'); render(); } }); return;
    case 'csave': { const g = k => ($('#ce-'+k) ? $('#ce-'+k).value.trim() : '');
      const patch = {ar:g('ar'), ph:g('ph'), nl:g('nl'), pic:g('pic'), tip:g('tip'), note:g('note'), verified:!!($('#ce-ok') && $('#ce-ok').checked)};
      if(!patch.ar || !patch.ph || !patch.nl){ toast('Vul Arabisch, uitspraak en Nederlands in.'); return; }
      patch.ph = translit(patch.ph, patch.ar);
      saveContent(a, patch).then(ok=>{ if(ok){ S.cedit = null; toast('Opgeslagen voor alle gezinnen'); render(); } }); return; }
    case 'creset': resetContent(a).then(()=>{ S.cedit = null; toast('Origineel teruggezet'); render(); }); return;
    case 'cnew': S.cnew = {w: WORLDS[0].id}; S.cedit = null; window.scrollTo(0,0); break;
    case 'cnew-cancel': S.cnew = null; break;
    case 'cnew-save': { const g = k => ($('#cn-'+k) ? $('#cn-'+k).value.trim() : '');
      const d = {new:true, ar:g('ar'), ph:g('ph'), nl:g('nl'), pic:g('pic')||'🆕', w:+g('w'), lesson:g('l'), concrete:!!($('#cn-con') && $('#cn-con').checked), verified:true};
      if(!d.ar || !d.ph || !d.nl || !d.lesson){ toast('Vul Arabisch, uitspraak, Nederlands en les in.'); return; }
      d.ph = translit(d.ph, d.ar);
      const id = 'u_' + uid() + uid();
      saveContent(id, d).then(ok=>{ if(ok){ S.cnew = null; toast('Nieuw woord toegevoegd: ' + d.ph); render(); } }); return; }
    case 'rec-skip': recNext(); break;
    case 'rec-end': S.recS = null; recRelease(); break;
    case 'pick': { DB.activeId=a; save(); S.screen='home'; const pl = me(); if(pl && voiceOn()){ const hr = new Date().getHours(); later(()=>speakNL((hr<12?'Goedemorgen ':hr<18?'Hoi ':'Goedenavond ')+pl.name+'! Klaar om te spelen?'), 250); } break; }
    case 'newp': S.newP={name:'',age:null,gender:null,avatar:pick(AVATARS)}; break;
    case 'np-age': S.newP.age=+a; break;
    case 'np-kind': S.newP.kind=a; S.newP.age = a==='teen' ? 13 : a==='adult' ? 18 : null; break;
    case 'np-g': S.newP.gender=a; break;
    case 'np-av': S.newP.avatar=a; break;
    case 'np-cancel': S.newP=null; break;
    case 'lesson': startLesson(+a,+b); return;
    case 'penalty': startPenalty(); return;
    case 'pen': penShoot(a); return;
    case 'pen-next': penNext(); return;
    case 'pen-again': { const opp = PEN && PEN.players.length>1 ? PEN.players.find(x=>x!==PEN.home) : null; penEndRestore(); startPenalty(opp); return; }
    case 'locked': toast('Speel eerst de les ervoor!'); return;
    case 'aopt': if(L.state!=='answer') return; L.sel=a; play(a); break;
    case 'fopt': if(L.state!=='answer') return; L.sel=+a; break;
    case 'ml': matchTap('l', a); return;
    case 'mr': matchTap('r', a); return;
    case 'review': startReview(); return;
    case 'alesson': startAdultLesson(a, +b); return;
    case 'talk-scene': talkStart(a); return;
    case 'talk-end': talkEnd(); break;
    case 'talk-retry': { const r = S.talk && S.talk.retry; if(r){ S.talk.retry = null; aiSend(r.text, r.opt); } return; }
    case 'talk-sug': { const lastAi = [...S.talk.msgs].reverse().find(m=>m.role==='ai'); const x = lastAi && lastAi.turn.suggestions[+a]; if(x){ const el = $('#talk-in'); if(el){ el.value = x.ph; el.focus(); } } return; }
    case 'talk-explain': aiSend('Kun je dat uitleggen in het Nederlands?', {explain:true}); return;
    case 'talk-nl': S.talk.msgs[+a].open = true; break;
    case 'talk-nlall': S.talk.showNl = !S.talk.showNl; break;
    case 'talk-save': saveAiWord(+a); break;
    case 'talk-mic': listen(); return;
    case 'ai-refresh': AI.enabled = null; AI.st = null; render(); aiStatus(); return;
    case 'ai-test': aiRunTest(); return;
    case 'ai-rate': aiRate(+a, +b); return;
    case 'ai-cfg': aiSetCfg(a, b); return;
    case 'sp-stt': spListen(+a); return;
    case 'sp-say': spSay(+a); return;
    case 'sp-rate': { const v = arVoices()[+a]; if(v) AI.sp.tts[v.name] = b; break; }
    case 'sp-voices': break;
    case 'sp-save': spSave(a); return;
    case 'setp-ai': { const k=DB.profiles.find(x=>x.id===S.pkid); k.aiAllowed = a==='1'; save(); flush(); break; }
    case 'setp-aid': { const k=DB.profiles.find(x=>x.id===S.pkid); k.aiDaily = +a; save(); flush(); break; }
    case 'ailog': S.ailog = S.ailog===+a ? null : +a; break;
    case 'ascn': startScenario(a); return;
    case 'atest': startAdultTest(a); return;
    case 'agram': S.sheet = 'gram:' + a; break;
    case 'sheet-close': S.sheet = null; break;
    case 'alv': S.alv = +a; break;
    case 'alevel': p.alevel = +a; S.alv = +a; save(); break;
    case 'dgoal': p.dgoal = +a; save(); break;
    case 'prac': startPractice(a); return;
    case 'fav': { p.favs = p.favs || []; const i = p.favs.indexOf(a); if(i>=0) p.favs.splice(i,1); else { p.favs.push(a); toast('Bewaard bij je favorieten'); } save(); break; }
    case 'df': S.df = a; S.dlimit = 50; break;
    case 'dmore': S.dlimit = (S.dlimit||50) + 50; break;
    case 'selfrec': selfRec(); return;
    case 'selfplay': if(SELF.url){ const au = new Audio(SELF.url); au.play().catch(()=>{}); } return;
    case 'hint': { const st=L.steps[L.i]; if(st.hintUsed||L.state!=='answer') return; st.hintUsed=true;
      if(st.type==='fill'){ const wrong = st.choices.map((c,k)=>k).filter(k=>st.choices[k]!==st.answer && k!==L.sel); if(wrong.length) st.hiddenK=[pick(wrong)]; }
      else { const wrong = (st.opts||[]).filter(o=>o!==st.id && o!==L.sel); if(wrong.length>1) st.hidden=[pick(wrong)]; }
      if(['listen','meaning','listen-nl'].includes(st.type) && hasAudio(st.id)) later(()=>play(st.id,true),200);
      if(voiceOn()) speakNL('Eentje kan weg! Kijk nog eens goed.'); break; }
    case 'opt': if(L.state!=='answer') return; L.sel=a; if(['translate','picword','chat'].includes(L.steps[L.i].type)) play(a,true);
      if(isKid() && L.steps[L.i].type==='listen'){ check(); return; } break;
    case 'helpme': if(S.screen==='lesson') autoPlay(); else penAuto(true); return;
    case 'tile': { const st=L.steps[L.i]; if(L.state!=='answer'||st.ans.includes(+a)) return; st.ans.push(+a); break; }
    case 'untile': { const st=L.steps[L.i]; if(L.state!=='answer') return; st.ans.splice(+a,1); break; }
    case 'mem': memTap(+a); return;
    case 'check': check(); return;
    case 'said': sfx('ok'); if(voiceOn()) later(()=>speakNL(pick(PRAISE_NL)),300); L.xp+=2; record(L.steps[L.i].id,true); L.ok=true; L.state='feedback'; L.praise=praise(); break;
    case 'next': next(); return;
    case 'quit': S.sheet='quit'; break;
    case 'quit-no': S.sheet=null; break;
    case 'quit-yes': hush(); S.sheet=null; addTime(me(), L && L.t0); save(); selfRelease(); L=null; S.screen='home'; break;
    case 'gate': if(+a===S.gate.a+S.gate.b){ S.screen='parent'; S.ptab='overview'; } else { toast('Dat klopt niet. Probeer het nog eens.'); S.gate=null; } break;
    case 'ptab': S.ptab=a; S.confirmDel=false; if(a!=='audio' && S.recS){ S.recS=null; recRelease(); } break;
    case 'pkid': S.pkid=a; S.confirmDel=false; break;
    case 'fw': S.filterW = isNaN(+a) ? a : +a; break;
    case 'setp-kind': { const k=DB.profiles.find(x=>x.id===S.pkid); applyKind(k, a); save(); break; }
    case 'setp-age': { const k=DB.profiles.find(x=>x.id===S.pkid); k.age=+a; k.level=+a<=6?1:2; save(); break; }
    case 'setp-lvl': { const k=DB.profiles.find(x=>x.id===S.pkid); k.level=+a; save(); break; }
    case 'setp-g': { const k=DB.profiles.find(x=>x.id===S.pkid); k.gender=a; save(); break; }
    case 'setp-av': { const k=DB.profiles.find(x=>x.id===S.pkid); k.avatar=a; save(); break; }
    case 'gstars': { const k=byId(a); if(!k) return; k.goal = k.goal||{}; k.goal.stars = Math.max(0, Math.min(60, (k.goal.stars||0) + (+b) * ((k.goal.stars||0)>=10?3:1))); if(!k.goal.emoji) k.goal.emoji='🎁'; save(); break; }
    case 'gemoji': { const k=byId(a); if(!k) return; k.goal = k.goal||{}; k.goal.emoji = b; save(); break; }
    case 'ggive': { const k=byId(a); if(!k) return; k.goalGiven = weekKey(); save(); confetti(60); toast('Beloning uitgereikt voor '+k.name); break; }
    case 'gclear': { const k=byId(a); if(!k) return; delete k.goal; save(); break; }
    case 'fstars': { const g = DB.settings.familyGoal = DB.settings.familyGoal||{}; g.stars = Math.max(0, Math.min(300, (g.stars||0) + (+a))); if(!g.emoji) g.emoji='🎁'; save(); break; }
    case 'femoji': { const g = DB.settings.familyGoal = DB.settings.familyGoal||{}; g.emoji = a; save(); break; }
    case 'fgive': DB.settings.familyGiven = weekKey(); save(); confetti(80); toast('Gezinsbeloning uitgereikt. Geniet ervan!'); break;
    case 'fclear': DB.settings.familyGoal = null; save(); break;
    case 'del-ask': S.confirmDel=true; break;
    case 'del-no': S.confirmDel=false; break;
    case 'del-yes': if(sb && AUTH.user) sb.from('players').delete().eq('id', S.pkid).then(({error})=>{ if(error) toast('Verwijderen lukte niet online.'); }); DB.profiles=DB.profiles.filter(x=>x.id!==S.pkid); if(DB.activeId===S.pkid) DB.activeId=DB.profiles[0]?.id||null; S.pkid=null; S.confirmDel=false; save(); toast('Profiel verwijderd'); break;
    case 'verify': if(AUTH.admin){ saveContent(a, {verified:!isVerified(a)}).then(()=>render()); return; } if(DB.verified[a]) delete DB.verified[a]; else DB.verified[a]=true; save(); break;
    case 'delaudio': removeAudio(a).then(()=>{ toast('Opname gewist'); render(); }); return;
    case 'bulk-save': bulkSave(); return;
    case 'delpic': removePic(a).then(()=>{ toast('Foto gewist'); render(); }); return;
    case 'bulk-cancel': closeBulk(); break;
    case 'pbulk-save': pbulkSave(); return;
    case 'pbulk-cancel': pbulkClose(); break;
    default: return;
  }
  render();
});
// zoekvakken: direct zoeken tijdens het typen
let SEARCH_T = null;
document.addEventListener('input', e=>{
  const t = e.target; if(!t || !(t.dataset.dq || t.dataset.cq)) return;
  clearTimeout(SEARCH_T);
  SEARCH_T = setTimeout(()=>{ const k = t.dataset.dq ? 'dq' : 'cq'; S[k] = t.value; if(k==='dq') S.dlimit = 50; else S.climit = 40; render();
    const el = $('#'+k); if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); } }, 180);
});
document.addEventListener('change', async e=>{
  const t = e.target;
  if(t.dataset.upload){
    const f = t.files && t.files[0]; if(!f) return;
    if(!f.type.startsWith('audio/') && !/\.(mp3|m4a|wav|ogg|aac|webm)$/i.test(f.name)){ toast('Kies een audiobestand (mp3, m4a of wav).'); return; }
    if(f.size > 3e6){ toast('Dit bestand is te groot. Houd opnames korter dan een paar seconden.'); return; }
    toast('Bezig met opslaan…');
    const r = await saveAudio(t.dataset.upload, f);
    const ph = ITEM[t.dataset.upload].ph;
    toast(r==='cloud' ? 'Opgeslagen voor "'+ph+'"' : 'Opslaan lukte niet ('+LAST_ERR+')');
    render(); return;
  }
  if(t.dataset.pic){
    const f = t.files && t.files[0]; if(!f) return;
    toast('Foto opslaan…');
    const r = await savePic(t.dataset.pic, f);
    toast(r==='ok' ? 'Foto opgeslagen bij "'+ITEM[t.dataset.pic].ph+'"' : 'Foto opslaan lukte niet ('+LAST_ERR+')');
    render(); return;
  }
  if(t.dataset.pbulk!==undefined){
    const files = [...(t.files||[])]; t.value = '';
    if(!files.length) return;
    pbulkClose(); S.pbulk = {rows:pbulkPlan(files), busy:false, done:0};
    render(); const el = $('.pb-list'); if(el) el.scrollIntoView({block:'center'}); return;
  }
  if(t.dataset.bulk!==undefined){
    const files = [...(t.files||[])].sort((x,y)=>x.name.localeCompare(y.name,'nl',{numeric:true}));
    if(!files.length) return;
    closeBulk();
    S.bulk = {files, assign:autoAssign(files), urls:files.map(f=>URL.createObjectURL(f)), status:[], busy:false, done:0};
    render(); window.scrollTo(0,0); return;
  }
  if(t.dataset.bassign!==undefined && S.bulk){ S.bulk.assign[+t.dataset.bassign] = t.value; S.bulk.status=[]; render(); return; }
  if(t.dataset.sets){ DB.settings[t.dataset.sets] = t.checked; save(); render(); return; }
  if(t.id==='cn-w' && S.cnew){ ['ar','ph','nl','pic'].forEach(k=>{ const el = $('#cn-'+k); if(el) S.cnew[k] = el.value; }); S.cnew.w = +t.value; render(); return; }
  if(t.dataset.rnote!==undefined){ aiRate(+t.dataset.rnote, 0, t.value.trim()); return; }
  if(t.dataset.dq){ S.dq = t.value; S.dlimit = 50; render(); const el = $('#dq'); if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); } return; }
  if(t.dataset.cq){ S.cq = t.value; S.climit = 40; render(); const el = $('#cq'); if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); } return; }
  if(t.dataset.greward){ const k = byId(t.dataset.greward); if(!k) return; k.goal = k.goal||{}; k.goal.reward = t.value.trim().slice(0,40); if(!k.goal.emoji) k.goal.emoji='🎁'; save(); render(); return; }
  if(t.dataset.freward){ const g = DB.settings.familyGoal = DB.settings.familyGoal||{}; g.reward = t.value.trim().slice(0,40); if(!g.emoji) g.emoji='🎁'; save(); render(); return; }
  if(t.dataset.setp){
    const k = DB.profiles.find(x=>x.id===S.pkid); if(!k) return;
    if(t.dataset.setp==='name'){ if(t.value.trim()) k.name=t.value.trim(); }
    else if(t.dataset.setp==='unlockAll') k.unlockAll = t.checked;
    save(); render();
  }
});

/* ---------- start ---------- */
render();
if(sb){
  sb.auth.onAuthStateChange((ev, session)=>{
    if(ev==='PASSWORD_RECOVERY'){ S.auth = {mode:'newpass'}; S.screen = 'auth'; }
    setTimeout(()=>onSession(session), 0);
  });
} else { AUTH.ready = true; render(); }
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='hidden'){ if(SYNC.t) flush(); return; }
  if(AUTH.user && !SYNC.t && !busyScreen() && !S.newP && S.screen!=='auth'){
    Promise.all([loadFamily(), loadMedia(), loadContent()]).then(()=>{ if(!busyScreen() && !S.newP && !S.cedit && !S.cnew) render(); });
  }
});
window.addEventListener('pagehide', ()=>{ if(SYNC.t) flush(); });
if('speechSynthesis' in window){ try{ pickNL(); speechSynthesis.onvoiceschanged=pickNL; }catch(e){} }
</script>
