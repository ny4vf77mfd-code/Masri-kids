let LAST = null;
function finishLesson(){
  const p = me(); const srs = !!L.lesson.srs; const lid0 = L.lesson.id;
  const stars = L.mistakes<=1 ? 3 : L.mistakes<=3 ? 2 : 1;
  const firstTime = !srs && !p.lessons[lid0];
  let xp = (srs ? 8 : 10) + stars*2 + L.xp;
  if(!srs){
    p.lessons[lid0] = Math.max(p.lessons[lid0]||0, stars);
    if(!p.best[lid0] || L.mistakes < p.best[lid0].mistakes) p.best[lid0] = {stars, mistakes:L.mistakes, date:today()};
  } else p.reviews = (p.reviews||0) + 1;
  // streak (nooit straf: een gemiste dag begint gewoon opnieuw bij 1)
  const t = today();
  if(p.last !== t){ p.streak = (p.last===yesterday()) ? (p.streak||0)+1 : 1; p.last = t; if(!p.days.includes(t)) p.days.push(t); }
  // sticker
  let sticker = null;
  const idx = srs ? -1 : ALL_LESSONS.findIndex(l=>l.id===lid0);
  if(firstTime && STICKERS[idx] && !p.stickers.includes(idx)){ p.stickers.push(idx); sticker = STICKERS[idx]; }
  // wereld klaar?
  const w = srs ? null : WORLDS[L.wi];
  const worldDone = !!(w && firstTime && w.lessons.every(l=>p.lessons[l.id]));
  const nxt = w ? WORLDS.findIndex((x,i)=>!x.bonus && prevWorld(p,i)===L.wi) : -1;
  const unlockedNext = !!(w && firstTime && nxt>=0 && w.lessons.filter(l=>p.lessons[l.id]).length===3);
  if(worldDone) xp += 50;
  // dagelijkse uitdaging
  daily(p); p.today.lessons++; p.today.xp += xp;
  let dailyBonus = false;
  const d2 = daily(p);
  if(!p.today.claimed && p.today[d2.k] >= d2.n){ p.today.claimed = true; xp += 20; p.today.xp += 20; dailyBonus = true; }
  p.xp += xp;
  const gBefore = goalState(p), fBefore = familyState();
  { const w7 = wk(p); w7.stars += stars; w7.lessons++; }
  const gAfter = goalState(p), fAfter = familyState();
  const goalHit = !!(gAfter && gAfter.done && !(gBefore && gBefore.done)), famHit = !!(fAfter && fAfter.done && !(fBefore && fBefore.done));
  const sec = addTime(p, L.t0);
  p.hist = (p.hist||[]).concat({d:today(), t:L.lesson.title, w: srs ? 'Herhalen' : w.name, ok:L.correct||0, n:L.answered||0, st:stars, s:sec}).slice(-40);
  const badges = checkBadges(p, {perfect: L.mistakes===0 && (L.answered||0)>=4, chat: L.steps.some(x=>x.type==='chat'), goalHit});
  save();
  LAST = {srs, stars, xp, mistakes:L.mistakes, goalHit, famHit, goal:gAfter && gAfter.g, fam:fAfter && fAfter.g, sticker, dailyBonus, worldDone, world:w, unlockedNext, next: WORLDS[nxt], badges};
  L = null; S.screen='done'; window.scrollTo(0,0); render(); confetti(stars===3||worldDone?90:50); sfx('goal');
  if(goalHit || famHit || worldDone) setTimeout(()=>confetti(120), 700);
  if(voiceOn()) setTimeout(()=>speakNL(goalHit ? 'Hoera! Je hebt je weekdoel gehaald! Laat het aan papa of mama zien!' : famHit ? 'Hoera! Samen hebben jullie het gezinsdoel gehaald!' : worldDone ? 'Wauw! Je hebt een hele wereld af!' : sticker ? 'Hoera! De les is klaar. Je krijgt een nieuwe sticker!' : 'Hoera! Goed gedaan!'), 500);
}

function penPool(p){

  if(pool.length < 6) pool = pool.concat(p.level===1 ? [...WORLDS[2].lessons[0].words, ...WORLDS[1].lessons[0].words] : [...WORLDS[0].lessons[0].words, ...WORLDS[3].lessons[0].words]);

const byId = id => DB.profiles.find(x=>x.id===id);

function authErr(e){
  const m = String(e && e.message || '').toLowerCase();
  if(m.includes('invalid login')) return 'E-mailadres of wachtwoord klopt niet.';
  if(m.includes('not confirmed')) return 'Bevestig eerst je e-mailadres via de link in je mail.';
  if(m.includes('already registered') || m.includes('already been registered')) return 'Dit e-mailadres heeft al een account. Log in.';
  if(m.includes('password') && (m.includes('least') || m.includes('weak') || m.includes('short'))) return 'Kies een sterker wachtwoord van minstens 8 tekens.';
  if(m.includes('rate') || m.includes('too many')) return 'Te veel pogingen. Wacht een paar minuten en probeer het opnieuw.';
  if(m.includes('fetch') || m.includes('network')) return 'Geen verbinding. Controleer je internet.';
  return 'Dat lukte niet: ' + (e && e.message || 'onbekende fout');
}

async function authSubmit(){
  const A = S.auth; if(A.busy) return;
  const email = ($('#a-email') ? $('#a-email').value : A.email || '').trim();
  const pass = $('#a-pass') ? $('#a-pass').value : '';
  A.email = email; A.msg = '';
  if(A.mode!=='newpass' && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ A.msg = 'Vul een geldig e-mailadres in.'; render(); return; }
  if(A.mode!=='reset' && pass.length < (A.mode==='login' ? 1 : 8)){ A.msg = A.mode==='login' ? 'Vul je wachtwoord in.' : 'Kies een wachtwoord van minstens 8 tekens.'; render(); return; }
  if(A.mode==='signup' && !$('#a-ok').checked){ A.msg = 'Vink aan dat je ouder of verzorger bent en toestemming geeft.'; render(); return; }
  A.busy = true; render();
  try{
    if(A.mode==='login'){ const {error} = await sb.auth.signInWithPassword({email, password:pass}); if(error) throw error; }
    else if(A.mode==='signup'){ const {data, error} = await sb.auth.signUp({email, password:pass, options:{emailRedirectTo: location.origin}}); if(error) throw error; if(!data.session){ A.mode='sent'; A.reset=false; } }
    else if(A.mode==='reset'){ const {error} = await sb.auth.resetPasswordForEmail(email, {redirectTo: location.origin}); if(error) throw error; A.mode='sent'; A.reset=true; }
    else if(A.mode==='newpass'){ const {error} = await sb.auth.updateUser({password:pass}); if(error) throw error; A.mode='login'; toast('Nieuw wachtwoord opgeslagen'); S.screen = me() ? 'home' : 'profiles'; }
  }catch(e){ A.msg = authErr(e); }
  A.busy = false; render();
}
let loadedFor = null;
async function onSession(session){
  const u = session && session.user || null;
  AUTH.user = u; AUTH.ready = true;
  if(!u){
    loadedFor = null; DB = EMPTY_DB(); MEDIA.audio = {}; MEDIA.shared = {}; Object.keys(PICS).forEach(k=>delete PICS[k]); AUTH.admin = false;
    if(S.screen!=='splash') S.screen = 'auth';
    render(); return;
  }
  if(loadedFor === u.id){ if(S.screen==='loading') S.screen = me() ? 'home' : 'profiles'; render(); return; }
  loadedFor = u.id;
  const wasSplash = S.screen==='splash';
  if(!wasSplash) { S.screen = 'loading'; render(); }
  await Promise.all([loadFamily(), loadMedia(), checkAdmin(), loadContent()]);
  if(S.auth.mode==='newpass'){ S.screen = 'auth'; }
  else if(!wasSplash) S.screen = me() ? 'home' : 'profiles';
  render();
}

function autoAssign(files){
  const norm = t => String(t).toLowerCase().normalize('NFD').replace(/[^a-z0-9]/g,'');
  const items = [...WORDS,...SENTENCES], used = new Set();
  const out = files.map(f=>{ const base = norm(f.name.replace(/\.[^.]+$/,''));
    const m = base && items.find(x=>!used.has(x.id) && (norm(x.id)===base || norm(x.ph)===base || norm(x.nl)===base));
    if(m){ used.add(m.id); return m.id; } return ''; });
  const queue = [...WORDS.filter(w=>w.w===S.filterW),...SENTENCES.filter(x=>x.w===S.filterW)].filter(x=>!hasAudio(x.id) && !used.has(x.id));
  return out.map(v=> v || (queue.length ? queue.shift().id : ''));
}
function closeBulk(){ if(S.bulk) S.bulk.urls.forEach(u=>{ try{URL.revokeObjectURL(u);}catch(e){} }); S.bulk=null; }
async function bulkSave(){
  const B = S.bulk; if(!B || B.busy) return;
  B.busy = true; B.done = 0; B.status = []; render();
  for(let i=0;i<B.files.length;i++){
    const id = B.assign[i]; if(!id) continue;
    const f = B.files[i];
    B.status[i] = f.size > 3e6 ? 'too_large' : await saveAudio(id, f);
    B.done++; render();
  }
  B.busy = false;
  const ok = B.status.filter(x=>x==='cloud'||x==='local').length;
  const bad = B.status.filter(x=>x==='fail'||x==='too_large').length;
  toast(bad ? `${ok} opgeslagen, ${bad} niet gelukt (${LAST_ERR})` : `${ok} opname${ok===1?'':'s'} opgeslagen`);
  if(!bad) closeBulk();
  render();
}

function navHTML(){
  const items = [['home','🗺️','Leren'],['words','📖','Woorden'],['scores','🏆','Scores'],['stickers','🏅','Prijzen'],['gate','🔒','Ouders']];
  const cur = S.screen==='parent' ? 'gate' : S.screen;
  return `<nav class="nav" aria-label="Menu"><div class="nav-in">${items.map(([k,e,t])=>`<button class="${cur===k?'on':''}" data-act="go:${k}"><span class="e">${e}</span>${t}</button>`).join('')}</div></nav>`;
}
function render(){
  const app = $('#app');
  const scr = S.screen;
  if(scr!=='splash' && scr!=='auth' && scr!=='loading' && AUTH.ready && !AUTH.user){ S.screen='auth'; return render(); }
  if(['home','words','stickers','penalty','scores','lesson','done'].includes(scr) && !me()) { S.screen='profiles'; return render(); }
  const map = {splash:splashHTML, auth:authHTML, loading:loadingHTML, profiles:profilesHTML, home:homeHTML, words:wordsHTML, stickers:stickersHTML, scores:scoresHTML, gate:gateHTML, parent:parentHTML, lesson:lessonHTML, done:doneHTML, penalty:penHTML};
  const showNav = me() && ['home','words','stickers','scores','gate','parent'].includes(scr);
  app.className = (showNav ? '' : 'full') + (isKid() ? ' lvl1' : '');
  app.innerHTML = map[scr]() + (showNav ? navHTML() : '');
  if(scr==='profiles' && S.newP){
    const f = $('#pform'), nm = $('#np-name');
    nm.addEventListener('input', ()=>{ S.newP.name = nm.value; $('#np-save').disabled = !(nm.value.trim() && S.newP.age); });
    f.addEventListener('submit', e=>{ e.preventDefault(); createProfile(); });
  }
  if(scr==='auth'){ const f = $('#aform'); if(f) f.addEventListener('submit', e=>{ e.preventDefault(); authSubmit(); }); }
}
let toastT;
function toast(msg){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const t = document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t);
  clearTimeout(toastT); toastT = setTimeout(()=>t.remove(), 2600);
}
function createProfile(){
  const n = S.newP; if(!n.name.trim()||!n.age) return;
  const p = {id:uid()+uid(), created:Date.now(), name:n.name.trim(), age:n.age, level:n.age<=6?1:2, gender:n.gender, avatar:n.avatar,
    xp:0, lessons:{}, best:{}, words:{}, stickers:[], days:[], streak:0, last:null, today:null, unlockAll:false};
  DB.profiles.push(p); DB.activeId=p.id; save(); flush(); S.newP=null; S.screen='home'; render();
}

/* ---------- klikken ---------- */
document.addEventListener('click', e=>{
  const bp = e.target.closest('[data-bplay]');
  if(bp && S.bulk){ e.preventDefault(); try{ if(curAudio) curAudio.pause(); }catch(x){} curAudio = new Audio(S.bulk.urls[+bp.dataset.bplay]); curAudio.play().catch(()=>toast('Deze opname kon niet worden afgespeeld.')); return; }
  const ps = e.target.closest('[data-play-slow]');
  if(ps){ e.preventDefault(); play(ps.dataset.playSlow, false, 0.65); return; }
  const pb = e.target.closest('[data-play]');
  if(pb){ e.preventDefault(); play(pb.dataset.play); return; }
  const el = e.target.closest('[data-act]'); if(!el) return;
  const [act, a, b] = el.dataset.act.split(':');
  const p = me();
  switch(act){
    case 'start': if(!AUTH.ready) return; S.screen = !AUTH.user ? 'auth' : (loadedFor ? (me() ? 'home' : 'profiles') : 'loading'); break;
    case 'reload': location.reload(); return;
    case 'auth': S.auth = {mode:a, email:S.auth.email}; break;
    case 'logout': recRelease(); flush().finally(()=>sb.auth.signOut()); S.screen='auth'; S.auth={mode:'login'}; break;
    case 'go': if(S.screen==='penalty'){ penEndRestore(); PEN=null; } if(a==='gate') S.gate=null; if(a==='profiles') S.newP=null; if(S.recS && a!=='parent'){ S.recS=null; recRelease(); }
      S.screen=a; S.confirmDel=false; window.scrollTo(0,0); break;
    case 'duel': startPenalty(a); return;
    case 'pen-ready': if(PEN){ PEN.state='q'; render(); penAuto(); } return;
    case 'rec': if(hasAudio(a) && !REC.mr && S.confirmRec!==a){ S.confirmRec = a; toast('Er is al een opname. Tik nog een keer om hem te vervangen.'); break; } S.confirmRec = null; recToggle(a); return;
    case 'rec-start': { const q = WORLDS.filter(w=>!a || w.id===+a).flatMap(w=>allItems().filter(x=>worldOfItem(x)===w.id && !hasAudio(x.id))).map(x=>x.id); if(!q.length) return; S.recS = {queue:q, i:0}; window.scrollTo(0,0); break; }
    case 'cf': S.cf = a; S.cq = ''; S.climit = 40; S.cedit = null; break;
    case 'cmore': S.climit = (S.climit||40) + 40; break;
    case 'cedit': S.cedit = a; S.cnew = null; break;
    case 'cedit-cancel': S.cedit = null; break;
    case 'cok': saveContent(a, {verified:true}).then(ok=>{ if(ok){ toast('Gemarkeerd als gecontroleerd'); render(); } }); return;
    case 'csave': { const g = k => ($('#ce-'+k) ? $('#ce-'+k).value.trim() : '');
      const patch = {ar:g('ar'), ph:g('ph'), nl:g('nl'), pic:g('pic'), tip:g('tip'), note:g('note'), verified:!!($('#ce-ok') && $('#ce-ok').checked)};
      if(!patch.ar || !patch.ph || !patch.nl){ toast('Vul Arabisch, uitspraak en Nederlands in.'); return; }
      saveContent(a, patch).then(ok=>{ if(ok){ S.cedit = null; toast('Opgeslagen voor alle gezinnen'); render(); } }); return; }
    case 'creset': resetContent(a).then(()=>{ S.cedit = null; toast('Origineel teruggezet'); render(); }); return;
    case 'cnew': S.cnew = {w: WORLDS[0].id}; S.cedit = null; window.scrollTo(0,0); break;
    case 'cnew-cancel': S.cnew = null; break;
    case 'cnew-save': { const g = k => ($('#cn-'+k) ? $('#cn-'+k).value.trim() : '');
      const d = {new:true, ar:g('ar'), ph:g('ph'), nl:g('nl'), pic:g('pic')||'🆕', w:+g('w'), lesson:g('l'), concrete:!!($('#cn-con') && $('#cn-con').checked), verified:true};
      if(!d.ar || !d.ph || !d.nl || !d.lesson){ toast('Vul Arabisch, uitspraak, Nederlands en les in.'); return; }
      const id = 'u_' + uid() + uid();
      saveContent(id, d).then(ok=>{ if(ok){ S.cnew = null; toast('Nieuw woord toegevoegd: ' + d.ph); render(); } }); return; }
    case 'rec-skip': recNext(); break;
    case 'rec-end': S.recS = null; recRelease(); break;
    case 'pick': { DB.activeId=a; save(); S.screen='home'; const pl = me(); if(pl && voiceOn()){ const hr = new Date().getHours(); setTimeout(()=>speakNL((hr<12?'Goedemorgen ':hr<18?'Hoi ':'Goedenavond ')+pl.name+'! Klaar om te spelen?'), 250); } break; }
    case 'newp': S.newP={name:'',age:null,gender:null,avatar:pick(AVATARS)}; break;
    case 'np-age': S.newP.age=+a; break;
    case 'np-g': S.newP.gender=a; break;
    case 'np-av': S.newP.avatar=a; break;
    case 'np-cancel': S.newP=null; break;
    case 'lesson': startLesson(+a,+b); return;
    case 'penalty': startPenalty(); return;
    case 'pen': penShoot(a); return;
    case 'pen-next': penNext(); return;
    case 'pen-again': { const opp = PEN && PEN.players.length>1 ? PEN.players.find(x=>x!==PEN.home) : null; penEndRestore(); startPenalty(opp); return; }
    case 'locked': toast('Speel eerst de les ervoor!'); return;
    case 'aopt': if(L.state!=='answer') return; L.sel=a; play(a); break;
    case 'fopt': if(L.state!=='answer') return; L.sel=+a; break;
    case 'ml': matchTap('l', a); return;
    case 'mr': matchTap('r', a); return;
    case 'review': startReview(); return;
    case 'hint': { const st=L.steps[L.i]; if(st.hintUsed||L.state!=='answer') return; st.hintUsed=true;
      if(st.type==='fill'){ const wrong = st.choices.map((c,k)=>k).filter(k=>st.choices[k]!==st.answer && k!==L.sel); if(wrong.length) st.hiddenK=[pick(wrong)]; }
      else { const wrong = (st.opts||[]).filter(o=>o!==st.id && o!==L.sel); if(wrong.length>1) st.hidden=[pick(wrong)]; }
      if(['listen','meaning','listen-nl'].includes(st.type) && hasAudio(st.id)) setTimeout(()=>play(st.id,true),200);
      if(voiceOn()) speakNL('Eentje kan weg! Kijk nog eens goed.'); break; }
    case 'opt': if(L.state!=='answer') return; L.sel=a; if(['translate','picword','chat'].includes(L.steps[L.i].type)) play(a,true);
      if(isKid() && L.steps[L.i].type==='listen'){ check(); return; } break;
    case 'helpme': if(S.screen==='lesson') autoPlay(); else penAuto(true); return;
    case 'tile': { const st=L.steps[L.i]; if(L.state!=='answer'||st.ans.includes(+a)) return; st.ans.push(+a); break; }
    case 'untile': { const st=L.steps[L.i]; if(L.state!=='answer') return; st.ans.splice(+a,1); break; }
    case 'mem': memTap(+a); return;
    case 'check': check(); return;
    case 'said': sfx('ok'); if(voiceOn()) setTimeout(()=>speakNL(pick(PRAISE_NL)),300); L.xp+=2; record(L.steps[L.i].id,true); L.ok=true; L.state='feedback'; L.praise=praise(); break;
    case 'next': next(); return;
    case 'quit': S.sheet='quit'; break;
    case 'quit-no': S.sheet=null; break;
    case 'quit-yes': S.sheet=null; addTime(me(), L && L.t0); save(); L=null; S.screen='home'; break;
    case 'gate': if(+a===S.gate.a+S.gate.b){ S.screen='parent'; S.ptab='overview'; } else { toast('Dat klopt niet. Probeer het nog eens.'); S.gate=null; } break;
    case 'ptab': S.ptab=a; S.confirmDel=false; if(a!=='audio' && S.recS){ S.recS=null; recRelease(); } break;
    case 'pkid': S.pkid=a; S.confirmDel=false; break;
    case 'fw': S.filterW=+a; break;
    case 'setp-age': { const k=DB.profiles.find(x=>x.id===S.pkid); k.age=+a; k.level=+a<=6?1:2; save(); break; }
    case 'setp-lvl': { const k=DB.profiles.find(x=>x.id===S.pkid); k.level=+a; save(); break; }
    case 'setp-g': { const k=DB.profiles.find(x=>x.id===S.pkid); k.gender=a; save(); break; }
    case 'setp-av': { const k=DB.profiles.find(x=>x.id===S.pkid); k.avatar=a; save(); break; }
    case 'gstars': { const k=byId(a); if(!k) return; k.goal = k.goal||{}; k.goal.stars = Math.max(0, Math.min(60, (k.goal.stars||0) + (+b) * ((k.goal.stars||0)>=10?3:1))); if(!k.goal.emoji) k.goal.emoji='🎁'; save(); break; }
    case 'gemoji': { const k=byId(a); if(!k) return; k.goal = k.goal||{}; k.goal.emoji = b; save(); break; }
    case 'ggive': { const k=byId(a); if(!k) return; k.goalGiven = weekKey(); save(); confetti(60); toast('Beloning uitgereikt voor '+k.name); break; }
    case 'gclear': { const k=byId(a); if(!k) return; delete k.goal; save(); break; }
    case 'fstars': { const g = DB.settings.familyGoal = DB.settings.familyGoal||{}; g.stars = Math.max(0, Math.min(300, (g.stars||0) + (+a))); if(!g.emoji) g.emoji='🎁'; save(); break; }
    case 'femoji': { const g = DB.settings.familyGoal = DB.settings.familyGoal||{}; g.emoji = a; save(); break; }
    case 'fgive': DB.settings.familyGiven = weekKey(); save(); confetti(80); toast('Gezinsbeloning uitgereikt. Geniet ervan!'); break;
    case 'fclear': DB.settings.familyGoal = null; save(); break;
    case 'del-ask': S.confirmDel=true; break;
    case 'del-no': S.confirmDel=false; break;
    case 'del-yes': if(sb && AUTH.user) sb.from('players').delete().eq('id', S.pkid).then(({error})=>{ if(error) toast('Verwijderen lukte niet online.'); }); DB.profiles=DB.profiles.filter(x=>x.id!==S.pkid); if(DB.activeId===S.pkid) DB.activeId=DB.profiles[0]?.id||null; S.pkid=null; S.confirmDel=false; save(); toast('Profiel verwijderd'); break;
    case 'verify': if(AUTH.admin){ saveContent(a, {verified:!isVerified(a)}).then(()=>render()); return; } if(DB.verified[a]) delete DB.verified[a]; else DB.verified[a]=true; save(); break;
    case 'delaudio': removeAudio(a).then(()=>{ toast('Opname gewist'); render(); }); return;
    case 'bulk-save': bulkSave(); return;
    case 'delpic': removePic(a).then(()=>{ toast('Foto gewist'); render(); }); return;
    case 'bulk-cancel': closeBulk(); break;
    default: return;
  }
  render();
});
document.addEventListener('change', async e=>{
  const t = e.target;
  if(t.dataset.upload){
    const f = t.files && t.files[0]; if(!f) return;
    if(!f.type.startsWith('audio/') && !/\.(mp3|m4a|wav|ogg|aac|webm)$/i.test(f.name)){ toast('Kies een audiobestand (mp3, m4a of wav).'); return; }
    if(f.size > 3e6){ toast('Dit bestand is te groot. Houd opnames korter dan een paar seconden.'); return; }
    toast('Bezig met opslaan…');
    const r = await saveAudio(t.dataset.upload, f);
    const ph = ITEM[t.dataset.upload].ph;
    toast(r==='cloud' ? 'Opgeslagen voor "'+ph+'"' : 'Opslaan lukte niet ('+LAST_ERR+')');
    render(); return;
  }
  if(t.dataset.pic){
    const f = t.files && t.files[0]; if(!f) return;
    toast('Foto opslaan…');
    const r = await savePic(t.dataset.pic, f);
    toast(r==='ok' ? 'Foto opgeslagen bij "'+ITEM[t.dataset.pic].ph+'"' : 'Foto opslaan lukte niet ('+LAST_ERR+')');
    render(); return;
  }
  if(t.dataset.bulk!==undefined){
    const files = [...(t.files||[])].sort((x,y)=>x.name.localeCompare(y.name,'nl',{numeric:true}));
    if(!files.length) return;
    closeBulk();
    S.bulk = {files, assign:autoAssign(files), urls:files.map(f=>URL.createObjectURL(f)), status:[], busy:false, done:0};
    render(); window.scrollTo(0,0); return;
  }
  if(t.dataset.bassign!==undefined && S.bulk){ S.bulk.assign[+t.dataset.bassign] = t.value; S.bulk.status=[]; render(); return; }
  if(t.dataset.sets){ DB.settings[t.dataset.sets] = t.checked; save(); render(); return; }
  if(t.id==='cn-w' && S.cnew){ ['ar','ph','nl','pic'].forEach(k=>{ const el = $('#cn-'+k); if(el) S.cnew[k] = el.value; }); S.cnew.w = +t.value; render(); return; }
  if(t.dataset.cq){ S.cq = t.value; S.climit = 40; render(); const el = $('#cq'); if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); } return; }
  if(t.dataset.greward){ const k = byId(t.dataset.greward); if(!k) return; k.goal = k.goal||{}; k.goal.reward = t.value.trim().slice(0,40); if(!k.goal.emoji) k.goal.emoji='🎁'; save(); render(); return; }
  if(t.dataset.freward){ const g = DB.settings.familyGoal = DB.settings.familyGoal||{}; g.reward = t.value.trim().slice(0,40); if(!g.emoji) g.emoji='🎁'; save(); render(); return; }
  if(t.dataset.setp){
    const k = DB.profiles.find(x=>x.id===S.pkid); if(!k) return;
    if(t.dataset.setp==='name'){ if(t.value.trim()) k.name=t.value.trim(); }
    else if(t.dataset.setp==='unlockAll') k.unlockAll = t.checked;
    save(); render();
  }
});

/* ---------- start ---------- */
render();
if(sb){
  sb.auth.onAuthStateChange((ev, session)=>{
    if(ev==='PASSWORD_RECOVERY'){ S.auth = {mode:'newpass'}; S.screen = 'auth'; }
    setTimeout(()=>onSession(session), 0);
  });
} else { AUTH.ready = true; render(); }
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='hidden'){ if(SYNC.t) flush(); return; }
  if(AUTH.user && !SYNC.t && !busyScreen() && !S.newP && S.screen!=='auth'){
    Promise.all([loadFamily(), loadMedia(), loadContent()]).then(()=>{ if(!busyScreen() && !S.newP && !S.cedit && !S.cnew) render(); });
  }
});
window.addEventListener('pagehide', ()=>{ if(SYNC.t) flush(); });
if('speechSynthesis' in window){ try{ pickNL(); speechSynthesis.onvoiceschanged=pickNL; }catch(e){} }
</script>
