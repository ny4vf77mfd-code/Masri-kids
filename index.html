function render(){
  const app = $('#app');
  const scr = S.screen;
  if(scr!=='splash' && scr!=='auth' && scr!=='loading' && AUTH.ready && !AUTH.user){ S.screen='auth'; return render(); }
  if(['home','words','stickers','penalty','scores','lesson','done'].includes(scr) && !me()) { S.screen='profiles'; return render(); }
  const map = {splash:splashHTML, auth:authHTML, loading:loadingHTML, profiles:profilesHTML, home:homeHTML, words:wordsHTML, stickers:stickersHTML, scores:scoresHTML, gate:gateHTML, parent:parentHTML, lesson:lessonHTML, done:doneHTML, penalty:penHTML};
  const showNav = me() && ['home','words','stickers','scores','gate','parent'].includes(scr);
  app.className = (showNav ? '' : 'full') + (isKid() ? ' lvl1' : '');
  app.innerHTML = map[scr]() + (showNav ? navHTML() : '');
  if(scr==='profiles' && S.newP){
    const f = $('#pform'), nm = $('#np-name');
    nm.addEventListener('input', ()=>{ S.newP.name = nm.value; $('#np-save').disabled = !(nm.value.trim() && S.newP.age); });
    f.addEventListener('submit', e=>{ e.preventDefault(); createProfile(); });
  }
  if(scr==='auth'){ const f = $('#aform'); if(f) f.addEventListener('submit', e=>{ e.preventDefault(); authSubmit(); }); }
}
let toastT;
function toast(msg){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const t = document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t);
  clearTimeout(toastT); toastT = setTimeout(()=>t.remove(), 2600);
}
function createProfile(){
  const n = S.newP; if(!n.name.trim()||!n.age) return;
  const p = {id:uid()+uid(), created:Date.now(), name:n.name.trim(), age:n.age, level:n.age<=6?1:2, gender:n.gender, avatar:n.avatar,
    xp:0, lessons:{}, best:{}, words:{}, stickers:[], days:[], streak:0, last:null, today:null, unlockAll:false};
  DB.profiles.push(p); DB.activeId=p.id; save(); flush(); S.newP=null; S.screen='home'; render();
}

/* ---------- klikken ---------- */
document.addEventListener('click', e=>{
  const bp = e.target.closest('[data-bplay]');
  if(bp && S.bulk){ e.preventDefault(); try{ if(curAudio) curAudio.pause(); }catch(x){} curAudio = new Audio(S.bulk.urls[+bp.dataset.bplay]); curAudio.play().catch(()=>toast('Deze opname kon niet worden afgespeeld.')); return; }
  const pb = e.target.closest('[data-play]');
  if(pb){ e.preventDefault(); play(pb.dataset.play); return; }
  const el = e.target.closest('[data-act]'); if(!el) return;
  const [act, a, b] = el.dataset.act.split(':');
  const p = me();
  switch(act){
    case 'start': if(!AUTH.ready) return; S.screen = !AUTH.user ? 'auth' : (loadedFor ? (me() ? 'home' : 'profiles') : 'loading'); break;
    case 'reload': location.reload(); return;
    case 'auth': S.auth = {mode:a, email:S.auth.email}; break;
    case 'logout': recRelease(); flush().finally(()=>sb.auth.signOut()); S.screen='auth'; S.auth={mode:'login'}; break;
    case 'go': if(S.screen==='penalty'){ penEndRestore(); PEN=null; } if(a==='gate') S.gate=null; if(a==='profiles') S.newP=null; if(S.recS && a!=='parent'){ S.recS=null; recRelease(); }
      S.screen=a; S.confirmDel=false; window.scrollTo(0,0); break;
    case 'duel': startPenalty(a); return;
    case 'pen-ready': if(PEN){ PEN.state='q'; render(); penAuto(); } return;
    case 'rec': recToggle(a); return;
    case 'rec-start': { const q = [...WORDS,...SENTENCES].filter(x=>!hasAudio(x.id)).map(x=>x.id); if(!q.length) return; S.recS = {queue:q, i:0}; window.scrollTo(0,0); break; }
    case 'rec-skip': recNext(); break;
    case 'rec-end': S.recS = null; recRelease(); break;
    case 'pick': DB.activeId=a; save(); S.screen='home'; break;
    case 'newp': S.newP={name:'',age:null,gender:null,avatar:pick(AVATARS)}; break;
    case 'np-age': S.newP.age=+a; break;
    case 'np-g': S.newP.gender=a; break;
    case 'np-av': S.newP.avatar=a; break;
    case 'np-cancel': S.newP=null; break;
    case 'lesson': startLesson(+a,+b); return;
    case 'penalty': startPenalty(); return;
    case 'pen': penShoot(a); return;
    case 'pen-next': penNext(); return;
    case 'pen-again': { const opp = PEN && PEN.players.length>1 ? PEN.players.find(x=>x!==PEN.home) : null; penEndRestore(); startPenalty(opp); return; }
    case 'locked': toast('Speel eerst de les ervoor!'); return;
    case 'opt': if(L.state!=='answer') return; L.sel=a; if(L.steps[L.i].type==='translate') play(a,true);
      if(isKid() && L.steps[L.i].type==='listen'){ check(); return; } break;
    case 'helpme': if(S.screen==='lesson') autoPlay(); else penAuto(true); return;
    case 'tile': { const st=L.steps[L.i]; if(L.state!=='answer'||st.ans.includes(+a)) return; st.ans.push(+a); break; }
    case 'untile': { const st=L.steps[L.i]; if(L.state!=='answer') return; st.ans.splice(+a,1); break; }
    case 'mem': memTap(+a); return;
    case 'check': check(); return;
    case 'said': sfx('ok'); if(voiceOn()) setTimeout(()=>speakNL(pick(PRAISE_NL)),300); L.xp+=2; record(L.steps[L.i].id,true); L.ok=true; L.state='feedback'; L.praise=praise(); break;
    case 'next': next(); return;
    case 'quit': S.sheet='quit'; break;
    case 'quit-no': S.sheet=null; break;
    case 'quit-yes': S.sheet=null; L=null; S.screen='home'; break;
    case 'gate': if(+a===S.gate.a+S.gate.b){ S.screen='parent'; S.ptab='overview'; } else { toast('Dat klopt niet. Probeer het nog eens.'); S.gate=null; } break;
    case 'ptab': S.ptab=a; S.confirmDel=false; if(a!=='audio' && S.recS){ S.recS=null; recRelease(); } break;
    case 'pkid': S.pkid=a; S.confirmDel=false; break;
    case 'fw': S.filterW=+a; break;
    case 'setp-age': { const k=DB.profiles.find(x=>x.id===S.pkid); k.age=+a; k.level=+a<=6?1:2; save(); break; }
    case 'setp-lvl': { const k=DB.profiles.find(x=>x.id===S.pkid); k.level=+a; save(); break; }
    case 'setp-g': { const k=DB.profiles.find(x=>x.id===S.pkid); k.gender=a; save(); break; }
    case 'setp-av': { const k=DB.profiles.find(x=>x.id===S.pkid); k.avatar=a; save(); break; }
    case 'del-ask': S.confirmDel=true; break;
    case 'del-no': S.confirmDel=false; break;
    case 'del-yes': if(sb && AUTH.user) sb.from('players').delete().eq('id', S.pkid).then(({error})=>{ if(error) toast('Verwijderen lukte niet online.'); }); DB.profiles=DB.profiles.filter(x=>x.id!==S.pkid); if(DB.activeId===S.pkid) DB.activeId=DB.profiles[0]?.id||null; S.pkid=null; S.confirmDel=false; save(); toast('Profiel verwijderd'); break;
    case 'verify': if(DB.verified[a]) delete DB.verified[a]; else DB.verified[a]=true; save(); break;
    case 'delaudio': removeAudio(a).then(()=>{ toast('Opname gewist'); render(); }); return;
    case 'bulk-save': bulkSave(); return;
    case 'delpic': removePic(a).then(()=>{ toast('Foto gewist'); render(); }); return;
    case 'bulk-cancel': closeBulk(); break;
    default: return;
  }
  render();
});
document.addEventListener('change', async e=>{
  const t = e.target;
  if(t.dataset.upload){
    const f = t.files && t.files[0]; if(!f) return;
    if(!f.type.startsWith('audio/') && !/\.(mp3|m4a|wav|ogg|aac|webm)$/i.test(f.name)){ toast('Kies een audiobestand (mp3, m4a of wav).'); return; }
    if(f.size > 3e6){ toast('Dit bestand is te groot. Houd opnames korter dan een paar seconden.'); return; }
    toast('Bezig met opslaan…');
    const r = await saveAudio(t.dataset.upload, f);
    const ph = ITEM[t.dataset.upload].ph;
    toast(r==='cloud' ? 'Opgeslagen voor "'+ph+'"' : 'Opslaan lukte niet ('+LAST_ERR+')');
    render(); return;
  }
  if(t.dataset.pic){
    const f = t.files && t.files[0]; if(!f) return;
    toast('Foto opslaan…');
    const r = await savePic(t.dataset.pic, f);
    toast(r==='ok' ? 'Foto opgeslagen bij "'+ITEM[t.dataset.pic].ph+'"' : 'Foto opslaan lukte niet ('+LAST_ERR+')');
    render(); return;
  }
  if(t.dataset.bulk!==undefined){
    const files = [...(t.files||[])].sort((x,y)=>x.name.localeCompare(y.name,'nl',{numeric:true}));
    if(!files.length) return;
    closeBulk();
    S.bulk = {files, assign:autoAssign(files), urls:files.map(f=>URL.createObjectURL(f)), status:[], busy:false, done:0};
    render(); window.scrollTo(0,0); return;
  }
  if(t.dataset.bassign!==undefined && S.bulk){ S.bulk.assign[+t.dataset.bassign] = t.value; S.bulk.status=[]; render(); return; }
  if(t.dataset.sets){ DB.settings[t.dataset.sets] = t.checked; save(); render(); return; }
  if(t.dataset.setp){
    const k = DB.profiles.find(x=>x.id===S.pkid); if(!k) return;
    if(t.dataset.setp==='name'){ if(t.value.trim()) k.name=t.value.trim(); }
    else if(t.dataset.setp==='unlockAll') k.unlockAll = t.checked;
    save(); render();
  }
});

/* ---------- start ---------- */
render();
if(sb){
  sb.auth.onAuthStateChange((ev, session)=>{
    if(ev==='PASSWORD_RECOVERY'){ S.auth = {mode:'newpass'}; S.screen = 'auth'; }
    setTimeout(()=>onSession(session), 0);
  });
} else { AUTH.ready = true; render(); }
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='hidden'){ if(SYNC.t) flush(); return; }
  if(AUTH.user && !SYNC.t && !busyScreen() && !S.newP && S.screen!=='auth'){
    Promise.all([loadFamily(), loadMedia()]).then(()=>{ if(!busyScreen() && !S.newP) render(); });
  }
});
window.addEventListener('pagehide', ()=>{ if(SYNC.t) flush(); });
if('speechSynthesis' in window){ try{ pickNL(); speechSynthesis.onvoiceschanged=pickNL; }catch(e){} }
</script>
</body>
