<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Masri Kids</title>
<meta name="description" content="Leer Egyptisch Arabisch met Mishmish de kat. Voor kinderen van 4 tot 9 jaar (en hun ouders).">
<meta name="theme-color" content="#14A99F">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Masri Kids">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=Nunito:wght@500;700;800;900&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0} [hidden]{display:none!important} img{max-width:100%}
/* Layout: één telefoonkolom; het leerpad slingert als de Nijl langs ronde lesknoppen.
   Bewust één lichte, zonnige look (kinderapp), daarom geen donkere variant. */
:root{
  --sand:#FFF5E1;      /* woestijnzand, achtergrond */
  --sand-2:#F7E3BC;
  --nile:#14A99F;      /* Nijl / faience-turquoise */
  --nile-d:#0B7D76;
  --lapis:#28367C;     /* lapis lazuli, tekst */
  --sun:#FFC43D;
  --sun-d:#DB9300;
  --coral:#FF6F59;
  --coral-d:#D24A35;
  --ok:#3DBB5C; --ok-d:#2A9246; --ok-bg:#E3F8E8;
  --try:#FF9F1C; --try-d:#D97E00; --try-bg:#FFF0D9;
  --card:#FFFFFF;
  --line:#EBDDC0;
  --muted:#6E6A86;
  --grey:#D9D3C4; --grey-d:#B8B0A0;
  --f-display:"Baloo Bhaijaan 2","Nunito",system-ui,sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-ar:"Baloo Bhaijaan 2","Geeza Pro","Noto Naskh Arabic",Tahoma,sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--sand);color:var(--lapis);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:50;background:var(--sand)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.1;text-wrap:balance}
p{margin:0}
.ar{font-family:var(--f-ar);direction:rtl;unicode-bidi:isolate}

#app{max-width:560px;margin:0 auto;min-height:100%;position:relative;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 110px}
#app.full{padding-bottom:16px}

/* ---------- knoppen ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:0 26px;border-radius:999px;
  font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:.02em;color:#fff;background:var(--nile);
  box-shadow:0 5px 0 var(--nile-d);transition:transform .08s, box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--nile-d)}
.btn.sun{background:var(--sun);color:var(--lapis);box-shadow:0 5px 0 var(--sun-d)}
.btn.coral{background:var(--coral);box-shadow:0 5px 0 var(--coral-d)}
.btn.ok{background:var(--ok);box-shadow:0 5px 0 var(--ok-d)}
.btn.try{background:var(--try);box-shadow:0 5px 0 var(--try-d)}
.btn.ghost{background:var(--card);color:var(--lapis);box-shadow:0 5px 0 var(--line);border:2px solid var(--line)}
.btn[disabled]{background:var(--grey);color:#fff;box-shadow:0 5px 0 var(--grey-d);cursor:default}
.btn.wide{width:100%}
.link{font-weight:800;color:var(--nile-d);text-decoration:underline;text-underline-offset:3px}

/* ---------- mascotte ---------- */
.mascot{display:block}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}

/* ---------- splash ---------- */
.splash{display:flex;flex-direction:column;align-items:center;text-align:center;gap:18px;padding-top:28px}
.splash h1{font-size:52px;font-weight:800;color:var(--lapis);letter-spacing:-.01em}
.splash h1 span{color:var(--nile)}
.splash .ar-title{font-size:34px;color:var(--coral);font-weight:800;margin-top:-10px}
.splash .lead{font-size:18px;max-width:30ch;color:var(--muted);font-weight:700}
.sun-disc{position:relative;width:230px;height:230px;border-radius:50%;background:radial-gradient(circle at 50% 45%,#FFE08A 0 55%,var(--sun) 56% 100%);display:grid;place-items:center}
.sun-disc::after{content:"";position:absolute;left:-30px;right:-30px;bottom:-6px;height:60px;
  background:linear-gradient(var(--sand-2),var(--sand-2)) bottom/100% 22px no-repeat,
  conic-gradient(from 135deg at 30% 100%, transparent 0 90deg, transparent 90deg) ;}
.pyr{position:absolute;bottom:0;width:100%;height:70px;pointer-events:none}
.splash .feat{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--card);border:2px solid var(--line);font-weight:800;font-size:14px}

/* ---------- profielen ---------- */
.ptitle{text-align:center;font-size:32px;margin:12px 0 4px}
.psub{text-align:center;color:var(--muted);font-weight:700;margin-bottom:20px}
.profiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px}
.pcard{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 8px 14px;border-radius:24px;background:var(--card);border:2px solid var(--line);box-shadow:0 5px 0 var(--line);transition:transform .08s}
.pcard:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.pav{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;font-size:44px;background:var(--sand)}
.pname{font-family:var(--f-display);font-weight:800;font-size:22px;max-width:100%;overflow-wrap:anywhere}
.plvl{font-size:13px;font-weight:800;color:var(--muted)}
.pcard.add{border-style:dashed;color:var(--nile-d)}
.pcard.add .pav{background:#E2F6F4;font-size:40px;font-weight:800}
.empty-note{grid-column:1/-1;text-align:center;padding:12px;color:var(--muted);font-weight:700}

.form{display:flex;flex-direction:column;gap:18px;background:var(--card);border:2px solid var(--line);border-radius:28px;padding:20px}
.form label.lb{font-weight:900;font-size:15px;display:block;margin-bottom:8px}
.inp{width:100%;min-height:52px;border-radius:16px;border:2px solid var(--line);padding:0 16px;font:inherit;font-size:20px;font-weight:800;color:var(--lapis);background:var(--sand)}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{min-width:52px;min-height:52px;padding:0 14px;border-radius:16px;border:2px solid var(--line);background:var(--sand);font-weight:900;font-size:18px}
.seg button.on{background:var(--nile);border-color:var(--nile-d);color:#fff}
.seg.av button{font-size:30px;padding:0 8px}
.hint{font-size:13px;color:var(--muted);font-weight:700;margin-top:6px}

/* ---------- topbalk ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--sand);display:flex;align-items:center;gap:10px;padding:6px 0 10px}
.topbar .me{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;font-size:18px;min-width:0}
.topbar .me .pav{width:44px;height:44px;font-size:26px;background:var(--card);border:2px solid var(--line)}
.topbar .me span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats{margin-left:auto;display:flex;gap:6px}
.stat{display:flex;align-items:center;gap:4px;padding:5px 10px;border-radius:999px;background:var(--card);border:2px solid var(--line);font-weight:900;font-size:15px;font-variant-numeric:tabular-nums}

/* ---------- dagelijkse uitdaging ---------- */
.daily{display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:24px;background:var(--lapis);color:#fff;margin-bottom:18px}
.daily .ic{flex:none;width:52px;height:52px;border-radius:16px;background:var(--sun);display:grid;place-items:center;font-size:28px}
.daily .tx{flex:1;min-width:0}
.daily .k{font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--sun)}
.daily .t{font-weight:900;font-size:17px}
.bar{height:12px;border-radius:999px;background:rgba(255,255,255,.2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:999px;background:var(--sun);transition:width .4s}
.welcome{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:12px 16px;margin-bottom:14px;font-weight:800;display:flex;gap:12px;align-items:center}

/* ---------- werelden & leerpad ---------- */
.world{margin-bottom:26px}
.wband{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 18px;border-radius:24px;background:var(--wc);color:#fff;box-shadow:0 5px 0 var(--wcd)}
.wband .wnum{font-size:12px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;opacity:.9}
.wband h2{font-size:28px;font-weight:800}
.wband p{font-weight:700;font-size:14px;opacity:.95}
.wband .wemoji{font-size:44px;flex:none}
.wband .wprog{font-size:13px;font-weight:900;margin-top:4px;opacity:.95}
.path{position:relative;display:flex;flex-direction:column;align-items:center;gap:18px;padding:22px 0 6px}
.path::before{content:"";position:absolute;top:10px;bottom:10px;left:50%;width:0;border-left:6px dotted color-mix(in srgb,var(--wc) 35%,transparent);transform:translateX(-50%)}
.node-row{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;transform:translateX(var(--x));z-index:1}
.node{width:78px;height:74px;border-radius:50%;display:grid;place-items:center;font-size:34px;background:var(--wc);box-shadow:0 7px 0 var(--wcd);transition:transform .08s}
.node:active{transform:translateY(5px);box-shadow:0 2px 0 var(--wcd)}
.node.locked{background:var(--grey);box-shadow:0 7px 0 var(--grey-d);cursor:default;filter:saturate(.2)}
.node.locked:active{transform:none;box-shadow:0 7px 0 var(--grey-d)}
.node.cur{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{outline:0 solid color-mix(in srgb,var(--wc) 40%,transparent)}50%{outline:10px solid color-mix(in srgb,var(--wc) 25%,transparent)}}
.nlabel{font-weight:900;font-size:14px;background:var(--sand);padding:0 6px;border-radius:8px;text-align:center;max-width:150px}
.nstars{display:flex;gap:2px}
.startbub{position:absolute;top:-30px;background:var(--card);color:var(--wcd);border:2px solid var(--line);font-weight:900;font-size:13px;letter-spacing:.08em;padding:2px 12px;border-radius:12px;animation:bob 1.6s ease-in-out infinite;white-space:nowrap}
.wlock{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:8px;padding:10px 14px;border-radius:16px;background:var(--card);border:2px dashed var(--line);font-weight:800;font-size:14px;color:var(--muted);text-align:center}
.soon h3{font-size:22px;margin:6px 0 10px}
.soon-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.soon-card{display:flex;gap:10px;align-items:center;padding:12px;border-radius:18px;background:var(--card);border:2px solid var(--line);font-weight:800;font-size:14px;opacity:.85}
.soon-card .e{font-size:28px;filter:grayscale(.3)}
.soon-card small{display:block;color:var(--muted);font-size:12px}

/* ---------- onderbalk ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:2px solid var(--line);
  padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.nav button{display:flex;flex-direction:column;align-items:center;gap:0;padding:6px 0;border-radius:16px;font-weight:900;font-size:12px;color:var(--muted)}
.nav button .e{font-size:26px;line-height:1.1}
.nav button.on{background:#E2F6F4;color:var(--nile-d);outline:2px solid #BFEAE6}

/* ---------- les ---------- */
.lesson{display:flex;flex-direction:column;min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px) - 28px)}
.lbar{display:flex;align-items:center;gap:12px;padding:4px 0 14px}
.xbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:28px;font-weight:900;color:var(--muted)}
.pbar{flex:1;height:18px;border-radius:999px;background:var(--sand-2);overflow:hidden}
.pbar i{display:block;height:100%;border-radius:999px;background:linear-gradient(var(--ok),var(--ok)) ;box-shadow:inset 0 -5px 0 rgba(0,0,0,.08), inset 0 4px 0 rgba(255,255,255,.35);transition:width .35s}
.lxp{font-weight:900;font-variant-numeric:tabular-nums;color:var(--sun-d)}
.ex{flex:1;display:flex;flex-direction:column;gap:16px}
.ex-k{font-family:var(--f-display);font-size:26px;font-weight:800}
.ex-k small{display:block;font-family:var(--f-body);font-size:14px;color:var(--muted);font-weight:800}
.bubble-row{display:flex;align-items:flex-end;gap:10px}
.bubble{position:relative;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:12px 16px;font-weight:800;flex:1;min-width:0}
.bubble::before{content:"";position:absolute;left:-10px;bottom:16px;width:16px;height:16px;background:var(--card);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}

.wordcard{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:22px 16px;border-radius:28px;background:var(--card);border:2px solid var(--line);box-shadow:0 5px 0 var(--line)}
.wordcard .pic{font-size:80px;line-height:1}
.wordcard .ar{font-size:44px;font-weight:800;line-height:1.3}
.wordcard .ph{font-size:24px;font-weight:900;color:var(--nile-d)}
.wordcard .nl{font-size:18px;font-weight:800;color:var(--muted)}
.tip{font-size:14px;font-weight:700;color:var(--muted);background:var(--sand);border-radius:12px;padding:6px 10px}

.prompt{display:flex;align-items:center;gap:16px;padding:14px 16px;border-radius:24px;background:var(--card);border:2px solid var(--line)}
.prompt .ar{font-size:32px;font-weight:800;line-height:1.3}
.prompt .ph{font-size:20px;font-weight:900;color:var(--nile-d)}
.prompt .pic{font-size:54px;line-height:1}
.prompt .nl{font-size:24px;font-weight:900}
.prompt .meta{min-width:0}

.play{flex:none;width:64px;height:64px;border-radius:20px;display:grid;place-items:center;background:var(--nile);color:#fff;box-shadow:0 5px 0 var(--nile-d);transition:transform .08s}
.play:active{transform:translateY(4px);box-shadow:0 1px 0 var(--nile-d)}
.play.big{width:84px;height:84px;border-radius:26px}
.play.sm{width:42px;height:42px;border-radius:14px;box-shadow:0 3px 0 var(--nile-d)}
.play.noaudio{background:var(--card);color:var(--muted);border:3px dashed var(--grey-d);box-shadow:none}
.play.tts{background:#E9E6F6;color:var(--lapis);box-shadow:0 5px 0 #C9C3E6}
.play svg{width:55%;height:55%}
.play.playing{animation:wob .5s ease-in-out 2}
@keyframes wob{50%{transform:scale(1.1)}}
.playwrap{display:flex;flex-direction:column;align-items:center;gap:4px}
.atag{font-size:11px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.list1{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:14px 10px;border-radius:22px;background:var(--card);border:3px solid var(--line);box-shadow:0 5px 0 var(--line);min-height:120px;transition:transform .08s}
.opt:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.opt .pic{font-size:56px;line-height:1}
.opt .lbl{font-weight:900;font-size:16px}
.opt.row{flex-direction:row;justify-content:space-between;min-height:68px;padding:10px 18px}
.opt.row .ph{font-size:20px;font-weight:900}
.opt.row .ar{font-size:26px;font-weight:800}
.opt.sel{border-color:var(--nile);background:#E2F6F4;box-shadow:0 5px 0 var(--nile)}
.opt.right{border-color:var(--ok);background:var(--ok-bg);box-shadow:0 5px 0 var(--ok)}
.opt.wrong{border-color:var(--try);background:var(--try-bg);box-shadow:0 5px 0 var(--try)}

.answer-line{min-height:76px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;padding:10px 0;border-bottom:3px solid var(--line);border-top:3px solid var(--line)}
.bank{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding-top:6px}
.tile{display:flex;flex-direction:column;align-items:center;padding:8px 14px;border-radius:16px;background:var(--card);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);font-weight:900;font-size:18px}
.tile .ar{font-size:16px;font-weight:700;color:var(--muted)}
.tile.used{visibility:hidden}

.memgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:420px){.memgrid{grid-template-columns:repeat(3,1fr)}}
.mcard{display:block;position:relative;width:100%;height:0;padding:0 0 130% 0;border-radius:18px;-webkit-perspective:600px;perspective:600px}
.mcard .in{display:block;position:absolute;inset:0;transition:transform .35s;-webkit-transform-style:preserve-3d;transform-style:preserve-3d}
.mcard.open .in,.mcard.matched .in{-webkit-transform:rotateY(180deg);transform:rotateY(180deg)}
.mcard .f,.mcard .b{position:absolute;inset:0;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;-webkit-backface-visibility:hidden;backface-visibility:hidden;padding:4px;text-align:center;transform:rotateY(0deg)}
.mcard .f{background:var(--coral);box-shadow:0 5px 0 var(--coral-d);color:#fff;font-size:30px}
.mcard .f::after{content:"";position:absolute;inset:8px;border:2px dashed rgba(255,255,255,.55);border-radius:12px}
.mcard .b{background:var(--card);border:3px solid var(--line);-webkit-transform:rotateY(180deg);transform:rotateY(180deg)}
.mcard .b .pic{font-size:40px;line-height:1}
.mcard .b .ph{font-weight:900;font-size:15px;line-height:1.15;overflow-wrap:anywhere}
.mcard .b .ar{font-size:16px;color:var(--muted)}
.mcard.matched .b{border-color:var(--ok);background:var(--ok-bg)}

.saycard .say-ic{font-size:40px}

.lfoot{margin:16px calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0;padding:16px max(16px,env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-bottom,0px));border-top:2px solid var(--line);display:flex;flex-direction:column;gap:12px;position:sticky;bottom:0;background:var(--sand)}
.lfoot.ok{background:var(--ok-bg);border-color:#BFE8C9}
.lfoot.bad{background:var(--try-bg);border-color:#FFD9A3}
.fb{display:flex;align-items:center;gap:12px}
.fb .big{font-family:var(--f-display);font-size:26px;font-weight:800}
.lfoot.ok .big{color:var(--ok-d)} .lfoot.bad .big{color:var(--try-d)}
.fb .sm{font-weight:800;font-size:15px}
.fb-ic{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:28px;background:#fff}
.pop{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}

/* ---------- les klaar ---------- */
.done-scr{display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px;padding-top:20px}
.done-scr h1{font-size:40px}
.bigstars{display:flex;gap:8px;align-items:flex-end}
.bigstars svg{width:70px;height:70px}
.bigstars svg:nth-child(2){width:88px;height:88px}
.bigstars .s{animation:pop .45s ease-out both}
.bigstars .s:nth-child(2){animation-delay:.2s}.bigstars .s:nth-child(3){animation-delay:.4s}
.rewards{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.rw{min-width:120px;padding:10px 14px;border-radius:18px;background:var(--card);border:2px solid var(--line);font-weight:900}
.rw b{display:block;font-family:var(--f-display);font-size:28px;color:var(--sun-d)}
.sticker-reveal{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 22px;border-radius:26px;background:var(--lapis);color:#fff;animation:pop .5s .6s both}
.sticker-reveal .k{font-size:12px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--sun)}
.stk{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;font-size:52px;background:var(--sun);border:5px solid #fff;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.stk svg{width:60%;height:60%}
.extra-msg{font-weight:900;padding:10px 14px;border-radius:16px;background:var(--try-bg);color:var(--lapis)}

#confetti{position:fixed;inset:0;pointer-events:none;z-index:100;overflow:hidden}
#confetti i{position:absolute;top:-20px;width:10px;height:16px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* ---------- stickers & woorden ---------- */
.page-h{font-size:32px;margin:6px 0 4px}
.page-sub{color:var(--muted);font-weight:700;margin-bottom:16px}
.stk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:14px}
.stk-item{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-weight:900;font-size:13px}
.stk-item .stk{width:84px;height:84px;font-size:44px}
.stk-item.locked .stk{background:var(--sand-2);border-color:var(--card);color:var(--grey-d);font-family:var(--f-display);font-size:36px}
.stk-item.locked span{color:var(--muted)}
.wgroup h2{font-size:22px;margin:18px 0 10px;display:flex;align-items:center;gap:8px}
.wlist{display:flex;flex-direction:column;gap:8px}
.wrow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:18px;background:var(--card);border:2px solid var(--line)}
.wrow .pic{font-size:32px;width:40px;text-align:center;flex:none}
.wrow .mid{flex:1;min-width:0}
.wrow .ph{font-weight:900;font-size:17px}
.wrow .nl{font-size:14px;font-weight:700;color:var(--muted)}
.wrow .ar{font-size:22px;font-weight:700}
.wrow.unseen{opacity:.5}
.badge{font-size:11px;font-weight:900;padding:2px 8px;border-radius:999px;background:var(--ok-bg);color:var(--ok-d);white-space:nowrap}
.badge.new{background:var(--sand-2);color:var(--muted)}
.badge.warn{background:var(--try-bg);color:var(--try-d)}

/* ---------- ouders ---------- */
.gate{display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px;padding-top:30px}
.gate .q{font-family:var(--f-display);font-size:40px;font-weight:800}
.gate .seg button{min-width:72px;min-height:64px;font-size:24px}
.ptabs{display:flex;gap:8px;margin:6px 0 16px;overflow-x:auto}
.ptabs button{padding:10px 16px;border-radius:999px;font-weight:900;background:var(--card);border:2px solid var(--line);white-space:nowrap}
.ptabs button.on{background:var(--lapis);border-color:var(--lapis);color:#fff}
.panel{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:16px;margin-bottom:14px}
.panel h3{font-size:20px;margin-bottom:10px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:460px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile-n{padding:10px;border-radius:16px;background:var(--sand)}
.tile-n b{display:block;font-family:var(--f-display);font-size:28px;font-variant-numeric:tabular-nums;line-height:1.1}
.tile-n span{font-size:12px;font-weight:800;color:var(--muted)}
.prog-row{display:grid;grid-template-columns:minmax(0,1fr) 2fr auto;gap:10px;align-items:center;font-weight:800;font-size:14px;margin-bottom:8px}
.prog-row .pb{height:12px;border-radius:999px;background:var(--sand-2);overflow:hidden}
.prog-row .pb i{display:block;height:100%;background:var(--nile);border-radius:999px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.muted{color:var(--muted);font-weight:700;font-size:14px}
.setrow{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.setrow > label{font-weight:900;font-size:14px}
.switch{display:flex;align-items:center;gap:12px;font-weight:800;cursor:pointer}
.switch input{width:52px;height:30px;appearance:none;border-radius:999px;background:var(--grey);position:relative;cursor:pointer;flex:none;transition:background .2s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s}
.switch input:checked{background:var(--nile)}
.switch input:checked::after{left:25px}
.arow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.arow:last-child{border-bottom:0}
.arow .ar{font-size:22px;font-weight:700}
.arow .ph{font-weight:900}
.arow .nl{font-size:13px;color:var(--muted);font-weight:700}
.arow .acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.mini{display:inline-flex;align-items:center;gap:4px;padding:6px 10px;border-radius:12px;border:2px solid var(--line);background:var(--sand);font-weight:900;font-size:13px;cursor:pointer;white-space:nowrap}
.mini.danger{color:var(--coral-d)}
.mini input{display:none}
.mini.on{background:var(--ok-bg);border-color:#BFE8C9;color:var(--ok-d)}
.key{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;font-weight:700}
.key b{font-family:var(--f-display);font-size:18px;color:var(--nile-d)}
.danger-zone{border-color:#FFD0C7}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;background:var(--lapis);color:#fff;font-weight:800;padding:10px 18px;border-radius:16px;max-width:min(90vw,440px);text-align:center;animation:pop .25s ease-out}
.sheet-bg{position:fixed;inset:0;z-index:80;background:rgba(40,54,124,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;background:var(--sand);border-radius:28px 28px 0 0;padding:22px max(16px,env(safe-area-inset-left,0px)) calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;text-align:center;animation:pop .25s}
.sheet h3{font-size:26px}

.status{font-weight:800;font-size:14px;padding:10px 12px;border-radius:14px;background:var(--sand);margin-bottom:12px}
.status.on{background:#E2F6F4;color:var(--nile-d)}
.steps{margin:0 0 14px;padding-left:22px;display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:15px}
.brow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.bmid{min-width:0;display:flex;flex-direction:column;gap:4px}
.fname{font-size:13px;font-weight:800;color:var(--muted);overflow-wrap:anywhere}
.inp.sel{min-height:44px;font-size:15px;padding:0 10px}
.brow-actions{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.pen-card{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 16px;border-radius:24px;margin-bottom:18px;color:#fff;
  background:repeating-linear-gradient(90deg,#3DBB5C 0 28px,#35AB52 28px 56px);box-shadow:0 5px 0 #1C7537}
.pen-card:active{transform:translateY(4px);box-shadow:0 1px 0 #1C7537}
.pen-card .ic{flex:none;width:56px;height:56px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:34px}
.pen-card b{display:block;font-family:var(--f-display);font-size:22px;line-height:1.1}
.pen-card span{font-weight:800;font-size:14px}
.pitch{position:relative;width:100%;max-width:100%;aspect-ratio:16/11;border-radius:24px;overflow:hidden;
  background:repeating-linear-gradient(90deg,#3DBB5C 0 12.5%,#35AB52 12.5% 25%)}
.stands{position:absolute;left:0;right:0;top:0;height:20%;background:
  radial-gradient(circle,#FFC43D 2.5px,transparent 3.5px) 0 0/16px 13px,
  radial-gradient(circle,#FF6F59 2.5px,transparent 3.5px) 8px 6px/16px 13px,#28367C}
.stands::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:#fff;opacity:.6}
.goal{position:absolute;left:14%;right:14%;top:22%;height:44%;border:6px solid #fff;border-bottom:0;border-radius:6px 6px 0 0;
  background:repeating-linear-gradient(45deg,rgba(255,255,255,.35) 0 2px,transparent 2px 12px),repeating-linear-gradient(-45deg,rgba(255,255,255,.35) 0 2px,transparent 2px 12px),rgba(0,0,0,.1)}
.boxline{position:absolute;left:4%;right:4%;top:66%;height:3px;background:rgba(255,255,255,.75)}
.spot{position:absolute;left:50%;top:86%;width:10px;height:10px;border-radius:50%;background:#fff;transform:translate(-50%,-50%)}
.keeper{position:absolute;left:50%;top:33%;width:20%;height:34%;transform:translateX(-50%);transition:left .45s cubic-bezier(.3,.7,.4,1),transform .45s}
.keeper svg{width:100%;height:100%;display:block}
.ball{position:absolute;left:50%;top:84%;font-size:clamp(28px,8vw,42px);line-height:1;transform:translate(-50%,-50%);transition:left .5s cubic-bezier(.2,.8,.3,1),top .5s cubic-bezier(.2,.8,.3,1),transform .5s;z-index:2}
.callout{position:absolute;left:0;right:0;top:4%;text-align:center;font-family:var(--f-display);font-weight:800;font-size:clamp(30px,9vw,46px);color:#fff;
  text-shadow:0 3px 0 rgba(0,0,0,.3);opacity:0;transform:scale(.5);transition:opacity .25s,transform .3s;z-index:3}
.callout.show{opacity:1;transform:scale(1)}
.callout small{display:block;font-family:var(--f-body);font-size:15px;font-weight:900}
.shots{display:flex;gap:6px;flex:1;justify-content:center}
.shots i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:16px;background:var(--sand-2);border:2px solid var(--line)}
.shots i.g{background:var(--ok-bg);border-color:var(--ok)} .shots i.s{background:var(--try-bg);border-color:var(--try)}
.pen-q{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.pen-fb{display:none}
.pen-fb.show{display:flex;flex-direction:column;gap:10px}
/* ================= moderne look (overschrijft de basis hierboven) ================= */
:root{
  --sand:#F3F5FA; --sand-2:#E7EBF4; --line:#E4E8F1; --grey:#D5DAE5; --grey-d:#B4BCCC; --muted:#6A6F8C;
  --shadow:0 10px 30px rgba(40,54,124,.10), 0 2px 6px rgba(40,54,124,.06);
  --shadow-sm:0 4px 14px rgba(40,54,124,.08);
}
body{background:
  radial-gradient(120% 60% at 0% 0%, rgba(20,169,159,.14), transparent 60%),
  radial-gradient(90% 50% at 100% 10%, rgba(255,196,61,.16), transparent 60%),
  var(--sand);background-attachment:fixed}
body::before{background:rgba(243,245,250,.9)}
/* knoppen: zachter, met kleurverloop */
.btn{border-radius:20px;box-shadow:0 4px 0 var(--nile-d),0 10px 22px rgba(11,125,118,.25);background:linear-gradient(180deg,#1DBDB2,var(--nile))}
.btn.sun{background:linear-gradient(180deg,#FFD15C,var(--sun));box-shadow:0 4px 0 var(--sun-d),0 10px 22px rgba(219,147,0,.25)}
.btn.ok{background:linear-gradient(180deg,#4FCB6C,var(--ok));box-shadow:0 4px 0 var(--ok-d),0 10px 22px rgba(42,146,70,.25)}
.btn.try{background:linear-gradient(180deg,#FFB03F,var(--try));box-shadow:0 4px 0 var(--try-d),0 10px 22px rgba(217,126,0,.22)}
.btn.ghost{background:#fff;border:0;box-shadow:var(--shadow-sm)}
.btn[disabled]{background:var(--grey);box-shadow:none}
/* kaarten: wit, geen harde randen, zachte schaduw */
.pcard,.form,.prompt,.wordcard,.opt,.tile,.wrow,.panel,.soon-card,.welcome,.bubble,.rw,.stat{border-color:transparent;box-shadow:var(--shadow-sm);background:#fff}
.pcard:active{box-shadow:var(--shadow-sm)}
.wordcard,.prompt,.panel,.form{box-shadow:var(--shadow);border-radius:28px}
.bubble::before{border-color:transparent;box-shadow:-2px 2px 4px rgba(40,54,124,.05)}
.inp,.seg button{background:var(--sand);border-color:transparent}
.seg button.on{background:linear-gradient(180deg,#1DBDB2,var(--nile));border-color:transparent;box-shadow:0 6px 14px rgba(11,125,118,.25)}
/* topbalk: glas */
.topbar{background:rgba(243,245,250,.82);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:8px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
.topbar .me .pav{border:0;box-shadow:var(--shadow-sm)}
.stat{border:0;padding:6px 12px}
/* dagelijkse uitdaging */
.daily{border-radius:28px;padding:16px 18px;background:
  radial-gradient(circle at 92% 20%, rgba(255,196,61,.35) 0 40px, transparent 41px),
  linear-gradient(135deg,#2E3E8F,#1F2A63);box-shadow:0 14px 30px rgba(31,42,99,.28)}
.daily .ic{border-radius:18px;box-shadow:0 6px 16px rgba(0,0,0,.18)}
.pen-card{border-radius:28px;box-shadow:0 14px 28px rgba(28,117,55,.28)}
/* werelden */
.wband{position:relative;overflow:hidden;border-radius:30px;padding:20px 20px;box-shadow:0 14px 30px color-mix(in srgb,var(--wcd) 40%,transparent);
  background:radial-gradient(circle at 100% 0%, rgba(255,255,255,.22) 0 70px, transparent 71px),
             radial-gradient(circle at 85% 120%, rgba(255,255,255,.14) 0 60px, transparent 61px),
             linear-gradient(135deg,var(--wc),var(--wcd))}
.wband .wemoji{width:72px;height:72px;border-radius:24px;display:grid;place-items:center;background:rgba(255,255,255,.22);font-size:42px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.wband h2{font-size:30px}
.wband .wprog{display:inline-block;margin-top:8px;padding:2px 10px;border-radius:999px;background:rgba(255,255,255,.22)}
.path::before{border-left:5px dashed color-mix(in srgb,var(--wc) 30%,transparent)}
.node{width:84px;height:84px;font-size:36px;background:radial-gradient(circle at 35% 28%, rgba(255,255,255,.45), transparent 45%),linear-gradient(160deg,var(--wc),var(--wcd));
  box-shadow:0 6px 0 var(--wcd),0 14px 26px color-mix(in srgb,var(--wcd) 35%,transparent);border:4px solid #fff}
.node.locked{background:var(--grey);box-shadow:0 6px 0 var(--grey-d);filter:none;opacity:.8}
.nlabel{background:#fff;padding:2px 10px;border-radius:999px;box-shadow:var(--shadow-sm)}
.startbub{border:0;box-shadow:var(--shadow-sm);color:var(--wcd)}
.wlock{border:0;background:#fff;box-shadow:var(--shadow-sm)}
/* zwevende menubalk */
.nav{background:transparent;border:0;padding:0 max(14px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
.nav-in{max-width:520px;background:rgba(255,255,255,.88);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-radius:26px;padding:6px;box-shadow:0 12px 32px rgba(40,54,124,.18)}
.nav button{border-radius:20px}
.nav button.on{background:linear-gradient(180deg,#E3F7F5,#D2F1EE);outline:0}
/* les */
.pbar{height:16px;background:var(--sand-2)}
.pbar i{background:linear-gradient(90deg,#4FCB6C,#2BB673)}
.opt{border:3px solid transparent;border-radius:24px}
.opt.sel{border-color:var(--nile);background:#F0FBFA;box-shadow:0 8px 20px rgba(20,169,159,.18)}
.opt.right{border-color:var(--ok);background:var(--ok-bg);box-shadow:0 8px 20px rgba(61,187,92,.18)}
.opt.wrong{border-color:var(--try);background:var(--try-bg);box-shadow:0 8px 20px rgba(255,159,28,.18)}
.play{border-radius:22px;background:linear-gradient(180deg,#1DBDB2,var(--nile));box-shadow:0 4px 0 var(--nile-d),0 8px 18px rgba(11,125,118,.25)}
.play.noaudio{background:#fff;border:2px dashed var(--grey-d)}
.answer-line{border-color:var(--line);border-width:2px}
.mcard .f{background:linear-gradient(160deg,#FF8A6E,var(--coral));box-shadow:0 4px 0 var(--coral-d),0 8px 18px rgba(210,74,53,.25)}
.mcard .b{border:0;box-shadow:var(--shadow-sm)}
.mcard.matched .b{box-shadow:0 0 0 3px var(--ok) inset}
.lfoot{background:rgba(243,245,250,.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:0;box-shadow:0 -8px 24px rgba(40,54,124,.06);border-radius:26px 26px 0 0}
.lfoot.ok{background:#E6F8EA}.lfoot.bad{background:#FFF2DE}
.pitch{box-shadow:var(--shadow)}
/* overig */
.sticker-reveal{border-radius:30px;background:linear-gradient(135deg,#2E3E8F,#1F2A63);box-shadow:0 14px 30px rgba(31,42,99,.28)}
.stk{box-shadow:0 8px 18px rgba(219,147,0,.3)}
.ptabs button{border:0;box-shadow:var(--shadow-sm);background:#fff}
.ptabs button.on{background:var(--lapis)}
.tile-n{background:var(--sand);border-radius:18px}
.chip{border:0;box-shadow:var(--shadow-sm)}
.sun-disc{box-shadow:0 20px 50px rgba(255,196,61,.45)}
.splash h1{font-size:56px}
/* ---------- Mishmish beweegt ---------- */
.mascot .m-all{transform-box:fill-box;transform-origin:50% 100%}
.mascot .m-tail{transform-box:fill-box;transform-origin:0% 100%;animation:wag 1.1s ease-in-out infinite alternate}
.mascot .m-eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
.mascot .m-ears{transform-box:fill-box;transform-origin:50% 100%}
.mascot .m-spark{opacity:0;transform-box:fill-box;transform-origin:center}
@keyframes wag{from{transform:rotate(-10deg)}to{transform:rotate(12deg)}}
@keyframes blink{0%,45%,49%,100%{transform:scaleY(1)}47%{transform:scaleY(.1)}}
.mascot.m-cheer .m-all{animation:jump .55s cubic-bezier(.3,.7,.4,1.4) 2}
.mascot.m-cheer .m-spark,.mascot.m-dance .m-spark{animation:spark 1.1s ease-out infinite}
.mascot.m-cheer .m-eyes{animation:none}
.mascot.m-encourage .m-all{animation:nod 1.1s ease-in-out 2}
.mascot.m-dance .m-all{animation:dance .9s ease-in-out infinite}
.mascot.m-peek .m-ears{animation:ears 2.2s ease-in-out infinite}
@keyframes jump{0%,100%{transform:translateY(0) scale(1)}45%{transform:translateY(-16px) scale(1.05,0.97)}}
@keyframes nod{0%,100%{transform:rotate(0)}30%{transform:rotate(-7deg)}70%{transform:rotate(5deg)}}
@keyframes dance{0%,100%{transform:rotate(0) translateY(0)}25%{transform:rotate(-9deg) translateY(-6px)}75%{transform:rotate(9deg) translateY(-6px)}}
@keyframes ears{0%,80%,100%{transform:rotate(0)}88%{transform:rotate(-6deg)}94%{transform:rotate(5deg)}}
@keyframes spark{0%{opacity:0;transform:scale(.4)}35%{opacity:1}100%{opacity:0;transform:scale(1.25)}}
.fb .mascot{flex:none;margin:-14px 0 -6px}
/* ---------- plaatjes in eigen stijl ---------- */
.opt .pic,.wordcard .pic,.prompt .pic,.wrow .pic,.mcard .b .pic{display:grid;place-items:center;aspect-ratio:1;border-radius:32%;line-height:1;
  background:radial-gradient(circle at 30% 22%,rgba(255,255,255,.95) 0 14%,transparent 50%),linear-gradient(160deg,#E2F7F4,#C4ECE7);
  box-shadow:inset 0 -6px 0 rgba(11,125,118,.10)}
.opt .pic{width:88px;font-size:52px}
.wordcard .pic{width:140px;font-size:84px;animation:float 3s ease-in-out infinite}
.prompt .pic{width:78px;font-size:46px;flex:none}
.wrow .pic{width:48px;font-size:28px;border-radius:30%}
.mcard .b .pic{width:76%;font-size:34px}
.grid2 .opt:nth-child(2) .pic{background:radial-gradient(circle at 30% 22%,rgba(255,255,255,.95) 0 14%,transparent 50%),linear-gradient(160deg,#FFF3D1,#FFE09A);box-shadow:inset 0 -6px 0 rgba(219,147,0,.12)}
.grid2 .opt:nth-child(3) .pic{background:radial-gradient(circle at 30% 22%,rgba(255,255,255,.95) 0 14%,transparent 50%),linear-gradient(160deg,#FFE6E0,#FFC6B9);box-shadow:inset 0 -6px 0 rgba(210,74,53,.12)}
.grid2 .opt:nth-child(4) .pic{background:radial-gradient(circle at 30% 22%,rgba(255,255,255,.95) 0 14%,transparent 50%),linear-gradient(160deg,#E7EBFA,#C9D1F2);box-shadow:inset 0 -6px 0 rgba(40,54,124,.12)}
.opt.sel .pic{transform:scale(1.06) rotate(-3deg);transition:transform .2s}
.opt.right .pic{animation:jump .5s ease-out}
@keyframes float{50%{transform:translateY(-6px) rotate(2deg)}}
.lvl1 .opt .lbl{display:none}
.lvl1 .opt{min-height:140px}
.lvl1 .opt .pic{width:104px;font-size:62px}
.lvl1 .ex-k{font-size:20px;opacity:.75}
.lvl1 .ex-k small{display:none}
.prompt.kid{justify-content:center;padding:20px}
.prompt.kid .play.big{width:110px;height:110px;border-radius:34px}
.parent-hint{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
.big-ic{font-size:34px;line-height:1}
.helpbtn{flex:none;width:52px;height:52px;border-radius:50%;background:#fff;box-shadow:var(--shadow-sm);display:grid;place-items:center;overflow:visible}
.helpbtn .mascot{margin-top:-4px}
.pic img{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block}
.thumb{width:40px;height:40px;border-radius:12px;object-fit:cover;flex:none}
/* ---------- online versie: inloggen, scorebord, duel, opnemen ---------- */
.nav-in{grid-template-columns:repeat(5,1fr)}
.nav button{font-size:11px}
.status.err{background:#FFE9E4;color:var(--coral-d)}
.auth{display:flex;flex-direction:column;gap:18px;padding-top:8px;max-width:440px;margin:0 auto}
.auth-hero{display:flex;flex-direction:column;align-items:center;gap:4px}
.auth-hero h1{font-size:40px}.auth-hero h1 span{color:var(--nile)}
.auth-h{font-size:26px}
.auth-links{display:flex;flex-direction:column;align-items:center;gap:12px}
.consent{align-items:flex-start;font-size:14px;line-height:1.35}
.consent input{margin-top:2px}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:10px;margin:8px 0 16px}
.pod{flex:1;max-width:130px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-width:0}
.pod .pav{width:58px;height:58px;font-size:34px;background:#fff;box-shadow:var(--shadow-sm)}
.pod b{font-family:var(--f-display);font-size:17px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pstars{font-weight:900;font-size:14px}
.pod .block{width:100%;border-radius:18px 18px 8px 8px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:28px;color:#fff}
.pod.p1 .block{height:96px;background:linear-gradient(180deg,#FFD15C,var(--sun-d))}
.pod.p2 .block{height:70px;background:linear-gradient(180deg,#C9D1F2,#8E9AD0)}
.pod.p3 .block{height:52px;background:linear-gradient(180deg,#FFC6B9,var(--coral))}
.score-list{display:flex;flex-direction:column;gap:4px}
.srow{display:grid;grid-template-columns:34px 48px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 6px;border-radius:16px}
.srow.me{background:#F0FBFA}
.srow .rank{font-weight:900;font-size:20px;text-align:center}
.srow .pav{width:46px;height:46px;font-size:28px}
.sname{display:flex;flex-direction:column;min-width:0}
.sname b{font-family:var(--f-display);font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sname span{font-size:12px;font-weight:800;color:var(--muted)}
.you{font-family:var(--f-body);font-size:11px;font-weight:900;background:var(--nile);color:#fff;border-radius:999px;padding:1px 7px;vertical-align:middle}
.snums{display:flex;gap:8px;font-size:14px;font-weight:800;font-variant-numeric:tabular-nums}
@media (max-width:400px){.snums span:nth-child(3){display:none}}
.opp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.opp-grid .pav{width:56px;height:56px;font-size:32px}
.opp-grid .pname{font-size:18px}
.duelbar{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
.drow{display:grid;grid-template-columns:30px minmax(0,70px) 1fr 24px;gap:6px;align-items:center;padding:3px 8px;border-radius:14px;opacity:.65}
.drow.turn{opacity:1;background:#fff;box-shadow:var(--shadow-sm)}
.dav{font-size:22px}
.dname{font-weight:900;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dscore{font-family:var(--f-display);font-size:20px;text-align:right}
.drow .shots{justify-content:flex-start;gap:3px}
.drow .shots i{width:20px;height:20px;font-size:11px}
.shots i.now{border-color:var(--nile);box-shadow:0 0 0 3px rgba(20,169,159,.2)}
.turn-scr{padding-top:40px}
.turn-av{width:140px;height:140px;border-radius:50%;display:grid;place-items:center;font-size:84px;background:#fff;box-shadow:var(--shadow);animation:jump .6s ease-out}
.winner{display:flex;align-items:center;gap:8px;font-size:56px}
.winner .pav{width:96px;height:96px;font-size:58px;background:#fff;box-shadow:var(--shadow)}
.rec-panel .wordcard{box-shadow:none;background:var(--sand);margin-bottom:16px}
.recbig{display:grid;place-items:center;width:104px;height:104px;margin:0 auto 10px;border-radius:50%;font-size:46px;color:#fff;
  background:linear-gradient(180deg,#FF8A6E,var(--coral));box-shadow:0 6px 0 var(--coral-d),0 14px 28px rgba(210,74,53,.3)}
.recbig.live{animation:recpulse 1s ease-in-out infinite;font-size:40px}
.recbig[disabled]{opacity:.6}
@keyframes recpulse{50%{box-shadow:0 6px 0 var(--coral-d),0 0 0 18px rgba(255,111,89,.25)}}
.rec-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;align-items:center}
.mini.rec-on{background:#FFE9E4;border-color:#FFC6B9;color:var(--coral-d);animation:recpulse 1s ease-in-out infinite}
.mini[disabled]{opacity:.45;cursor:default}
/* =================== Duo-stijl: plat, wit, dikke randjes, 3D-knoppen =================== */
:root{
  --duo-line:#E5E5E5; --duo-line-d:#CECECE; --duo-ink:#3C3C3C; --duo-mute:#777777; --duo-bg:#FFFFFF;
  --duo-sel:#DDF4FF; --duo-sel-b:#84D8FF; --duo-sel-t:#1899D6;
  --nile:#17B6AA; --nile-d:#0E8C82;
  --ok:#3FBF48; --ok-d:#2E9A36; --ok-bg:#D7FFB8; --ok-t:#2D8A2F;
  --try:#FF9F1C; --try-d:#D97E00; --try-bg:#FFE9C9; --try-t:#B86200;
  --sun:#FFC800; --sun-d:#E0A800; --coral:#FF6B57; --coral-d:#D94A38;
  --lapis:#3C3C3C; --sand:#F7F7F7; --sand-2:#E5E5E5; --line:#E5E5E5; --muted:#777777; --grey:#E5E5E5; --grey-d:#AFAFAF;
  --f-display:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --shadow:none; --shadow-sm:none;
}
body{background:var(--duo-bg)!important;color:var(--duo-ink)}
body::before{background:var(--duo-bg)}
h1,h2,h3,.ptitle,.page-h,.ex-k,.pname,.auth-h{font-family:var(--f-display);font-weight:900;color:var(--duo-ink);letter-spacing:-.01em}
.splash h1 span,.auth-hero h1 span{color:var(--nile)}
/* knoppen */
.btn{border-radius:16px;background:var(--nile);color:#fff;box-shadow:0 4px 0 var(--nile-d);font-family:var(--f-display);font-weight:900;font-size:16px;letter-spacing:.06em;text-transform:uppercase;min-height:52px;border:0}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--nile-d)}
.btn.sun{background:var(--sun);color:#fff;box-shadow:0 4px 0 var(--sun-d);text-shadow:0 1px 0 rgba(0,0,0,.08)}
.btn.ok{background:var(--ok);box-shadow:0 4px 0 var(--ok-d)}
.btn.try{background:var(--try);box-shadow:0 4px 0 var(--try-d)}
.btn.coral{background:var(--coral);box-shadow:0 4px 0 var(--coral-d)}
.btn.ghost{background:#fff;color:var(--nile);border:2px solid var(--duo-line);box-shadow:0 4px 0 var(--duo-line)}
.btn.ghost:active{box-shadow:0 0 0 var(--duo-line)}
.btn[disabled]{background:var(--duo-line);color:#AFAFAF;box-shadow:0 4px 0 var(--duo-line-d)!important;transform:none}
.link{color:var(--duo-sel-t);text-decoration:none;font-weight:900;text-transform:uppercase;letter-spacing:.05em;font-size:14px}
/* kaarten en vlakken: wit met grijze rand, geen schaduw */
.pcard,.form,.prompt,.wordcard,.wrow,.panel,.soon-card,.welcome,.bubble,.tile,.chip,.nlabel,.wlock,.ptabs button,.mini{background:#fff;border:2px solid var(--duo-line);box-shadow:none}
.pcard{border-radius:16px;box-shadow:0 4px 0 var(--duo-line)}
.pcard:active{transform:translateY(4px);box-shadow:0 0 0 var(--duo-line)}
.pcard.add{border-style:solid;border-color:var(--duo-line)}
.pcard.add .pav{background:var(--duo-sel);color:var(--duo-sel-t)}
.pav{background:var(--sand)}
.panel,.form{border-radius:16px}
.wordcard,.prompt{border-radius:16px}
.bubble{border-radius:16px}
.bubble::before{background:#fff;border-left:2px solid var(--duo-line);border-bottom:2px solid var(--duo-line);box-shadow:none}
.inp{background:var(--sand);border:2px solid var(--duo-line);border-radius:12px;color:var(--duo-ink)}
.inp:focus{border-color:var(--duo-sel-b);outline:0;background:#fff}
.seg button{background:#fff;border:2px solid var(--duo-line);box-shadow:0 3px 0 var(--duo-line);border-radius:12px;color:var(--duo-ink)}
.seg button.on{background:var(--duo-sel);border-color:var(--duo-sel-b);color:var(--duo-sel-t);box-shadow:0 3px 0 var(--duo-sel-b)}
.status{background:var(--sand);border-radius:12px}
.status.on{background:var(--duo-sel);color:var(--duo-sel-t)}
.muted,.hint,.page-sub,.psub,.plvl{color:var(--duo-mute)}
.tile-n{background:#fff;border:2px solid var(--duo-line);border-radius:14px}
.chip{border-radius:12px}
.mini{border-radius:12px;box-shadow:0 2px 0 var(--duo-line);color:var(--duo-ink)}
.mini.on{background:var(--ok-bg);border-color:#A5ED6E;color:var(--ok-t)}
.ptabs button{border-radius:12px;color:var(--duo-mute);box-shadow:0 2px 0 var(--duo-line)}
.ptabs button.on{background:var(--duo-sel);border-color:var(--duo-sel-b);color:var(--duo-sel-t);box-shadow:0 2px 0 var(--duo-sel-b)}
.switch input{background:var(--duo-line)}
.switch input:checked{background:var(--nile)}
/* topbalk */
.topbar{background:#fff;-webkit-backdrop-filter:none;backdrop-filter:none;border-bottom:2px solid var(--duo-line);padding-bottom:10px;margin-bottom:14px}
.topbar .me .pav{background:#fff;border:2px solid var(--duo-line);box-shadow:none}
.stat{background:none;border:0;box-shadow:none;padding:4px 6px;font-weight:900;font-size:17px}
.st-fire{color:#FF9600}.st-fire.off{color:#AFAFAF;filter:grayscale(1)}.st-star{color:#E0A800}.st-xp{color:#1CB0F6}
/* dagelijkse uitdaging (zoals een dagopdracht) */
.daily{background:#fff;color:var(--duo-ink);border:2px solid var(--duo-line);border-radius:16px;box-shadow:none;padding:14px 16px}
.daily .ic{background:#FFF4CC;box-shadow:none;border-radius:12px}
.daily .k{color:var(--duo-mute)}
.daily .t{color:var(--duo-ink)}
.daily .bar{background:var(--duo-line);height:16px}
.daily .bar i{background:var(--sun);box-shadow:inset 0 4px 0 rgba(255,255,255,.35)}
.pen-card{border-radius:16px;box-shadow:0 4px 0 #1C7537;background:#3FBF48}
.pen-card:active{transform:translateY(4px);box-shadow:none}
.pen-card .ic{box-shadow:none}
.welcome{border-radius:16px}
/* werelden en pad */
.wband{background:var(--wc);border-radius:16px;box-shadow:0 4px 0 var(--wcd);padding:16px 18px}
.wband::before,.wband::after{display:none}
.wband .wemoji{width:auto;height:auto;background:none;border-radius:0;-webkit-backdrop-filter:none;backdrop-filter:none;font-size:46px}
.wband h2{color:#fff;font-size:24px}
.wband .wnum{opacity:.85}
.wband .wprog{background:rgba(0,0,0,.15);border-radius:8px}
.path{gap:30px;padding-top:34px}
.node-row:has(.startbub){margin-top:30px}
.startbub{top:-52px}
.path::before{display:none}
.node{width:72px;height:66px;border:0;border-radius:50%;font-size:30px;background:var(--wc);box-shadow:0 7px 0 var(--wcd)}
.node:active{transform:translateY(6px);box-shadow:0 1px 0 var(--wcd)}
.node.locked{background:var(--duo-line);box-shadow:0 7px 0 var(--duo-line-d);opacity:1;filter:none}
.node.locked:active{transform:none;box-shadow:0 7px 0 var(--duo-line-d)}
.node.cur{animation:none;outline:none;position:relative}
.node.cur{box-shadow:0 7px 0 var(--wcd),0 0 0 8px #fff,0 0 0 14px color-mix(in srgb,var(--wc) 30%,#fff)}
.node.cur:active{box-shadow:0 1px 0 var(--wcd),0 0 0 8px #fff,0 0 0 14px color-mix(in srgb,var(--wc) 30%,#fff)}
.nlabel{border-radius:10px;font-size:13px;color:var(--duo-mute)}
.startbub{top:-44px;background:#fff;color:var(--wc);border:2px solid var(--duo-line);border-radius:12px;font-weight:900;letter-spacing:.08em;box-shadow:none}
.startbub::after{content:"";position:absolute;left:50%;bottom:-8px;width:12px;height:12px;margin-left:-6px;background:#fff;border-right:2px solid var(--duo-line);border-bottom:2px solid var(--duo-line);transform:rotate(45deg)}
.wlock{border-style:solid;border-radius:14px}
.soon-card{border-radius:14px;opacity:1}
.soon-card .e{filter:grayscale(1);opacity:.6}
/* onderbalk */
.nav{background:#fff;border-top:2px solid var(--duo-line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.nav-in{background:none;-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:none;border-radius:0;padding:0}
.nav button{border:2px solid transparent;border-radius:12px;color:var(--duo-mute);text-transform:uppercase;letter-spacing:.04em;font-size:10px}
.nav button.on{background:var(--duo-sel);border-color:var(--duo-sel-b);color:var(--duo-sel-t)}
/* les */
.lbar{gap:14px}
.xbtn{color:#AFAFAF}
.pbar{height:16px;background:var(--duo-line)}
.pbar i{background:var(--ok);box-shadow:inset 0 -0 0 transparent;position:relative}
.pbar i::after{content:"";position:absolute;left:8px;right:8px;top:4px;height:4px;border-radius:4px;background:rgba(255,255,255,.35)}
.lxp{color:#1CB0F6}
.ex-k{font-size:24px}
.ex-k small{color:var(--duo-mute)}
.opt{background:#fff;border:2px solid var(--duo-line);border-radius:16px;box-shadow:0 4px 0 var(--duo-line)}
.opt:active{transform:translateY(4px);box-shadow:0 0 0 var(--duo-line)}
.opt .lbl{color:var(--duo-ink)}
.opt.sel{background:var(--duo-sel);border-color:var(--duo-sel-b);box-shadow:0 4px 0 var(--duo-sel-b)}
.opt.sel .lbl,.opt.sel .ph{color:var(--duo-sel-t)}
.opt.right{background:var(--ok-bg);border-color:#A5ED6E;box-shadow:0 4px 0 #A5ED6E}
.opt.right .lbl,.opt.right .ph{color:var(--ok-t)}
.opt.wrong{background:var(--try-bg);border-color:#FFC97A;box-shadow:0 4px 0 #FFC97A}
.opt .pic,.wordcard .pic,.prompt .pic,.wrow .pic,.mcard .b .pic,.grid2 .opt .pic{background:none!important;box-shadow:none!important;border-radius:16px}
.opt.sel .pic{transform:none}
.play{background:#1CB0F6;box-shadow:0 4px 0 #1899D6;border-radius:16px}
.play:active{transform:translateY(4px);box-shadow:0 0 0 #1899D6}
.play.noaudio{background:#fff;border:2px dashed var(--duo-line-d);box-shadow:none;color:#AFAFAF}
.wordcard .ph,.prompt .ph{color:var(--duo-sel-t)}
.answer-line{border-color:var(--duo-line)}
.tile{border-radius:12px;box-shadow:0 3px 0 var(--duo-line);color:var(--duo-ink)}
.mcard .f{background:#1CB0F6;box-shadow:0 4px 0 #1899D6;border-radius:16px}
.mcard .f::after{border-color:rgba(255,255,255,.4)}
.mcard .b{border:2px solid var(--duo-line);box-shadow:0 4px 0 var(--duo-line);border-radius:16px}
.mcard.matched .b{background:var(--ok-bg);border-color:#A5ED6E;box-shadow:0 4px 0 #A5ED6E}
.lfoot{background:#fff;-webkit-backdrop-filter:none;backdrop-filter:none;border-top:2px solid var(--duo-line);box-shadow:none;border-radius:0}
.lfoot.ok{background:var(--ok-bg);border-color:var(--ok-bg)}
.lfoot.bad{background:var(--try-bg);border-color:var(--try-bg)}
.lfoot.ok .big{color:var(--ok-t)} .lfoot.bad .big{color:var(--try-t)}
.lfoot.ok .sm{color:var(--ok-t)} .lfoot.bad .sm{color:var(--try-t)}
.tip{background:var(--sand);border-radius:12px}
/* klaar-scherm: statistiekblokken met gekleurde kop */
.done-scr h1{color:#E0A800;font-size:34px}
.rewards{gap:10px;width:100%;justify-content:center}
.rw{flex:1;max-width:150px;min-width:0;padding:0;border-radius:16px;border:2px solid;overflow:hidden;background:#fff;box-shadow:none}
.rw .rwh{display:block;padding:6px 4px;color:#fff;font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.05em}
.rw b{display:block;padding:10px 4px;font-family:var(--f-display);font-weight:900;font-size:22px}
.rw-xp{border-color:#FFC800}.rw-xp .rwh{background:#FFC800}.rw-xp b{color:#E0A800}
.rw-star{border-color:#1CB0F6}.rw-star .rwh{background:#1CB0F6}.rw-star b{color:#1899D6}
.rw-ok{border-color:var(--ok)}.rw-ok .rwh{background:var(--ok)}.rw-ok b{color:var(--ok-t)}
.extra-msg{background:var(--sand);border:2px solid var(--duo-line);color:var(--duo-ink)}
.sticker-reveal{background:#fff;color:var(--duo-ink);border:2px solid var(--duo-line);border-radius:16px;box-shadow:none}
.sticker-reveal .k{color:#E0A800}
.stk{box-shadow:0 4px 0 var(--sun-d);border-color:#fff}
/* scorebord en duel */
.srow.me{background:var(--duo-sel)}
.you{background:var(--duo-sel-t)}
.pod .pav{border:2px solid var(--duo-line);box-shadow:none}
.pod .block{border-radius:12px 12px 0 0}
.pod.p1 .block{background:#FFC800;box-shadow:inset 0 -6px 0 #E0A800}
.pod.p2 .block{background:#CECECE;box-shadow:inset 0 -6px 0 #AFAFAF}
.pod.p3 .block{background:#FF9600;box-shadow:inset 0 -6px 0 #D97E00}
.drow.turn{background:var(--duo-sel);box-shadow:none;border:2px solid var(--duo-sel-b)}
.turn-av,.winner .pav{box-shadow:none;border:3px solid var(--duo-line)}
.pitch{box-shadow:none;border-radius:16px}
.shots i{background:#fff;border-color:var(--duo-line)}
.recbig{box-shadow:0 6px 0 var(--coral-d)}
.sun-disc{box-shadow:none}
.daily .tx .bar{border-radius:999px}
.toast{background:var(--duo-ink);border-radius:12px}
/* ---------- beloningen ---------- */
.reward{display:flex;gap:14px;align-items:center;background:#fff;border:2px solid var(--duo-line);border-radius:16px;padding:14px 16px;margin-bottom:14px}
.reward .re{flex:none;width:58px;height:58px;border-radius:14px;display:grid;place-items:center;font-size:36px;background:#FFF4CC}
.reward.fam .re{background:var(--duo-sel)}
.reward .rt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.reward .rk{font-size:12px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--duo-mute)}
.reward .rn{font-family:var(--f-display);font-weight:900;font-size:19px;color:var(--duo-ink);overflow-wrap:anywhere}
.reward .rmsg{font-weight:800;font-size:14px;color:var(--duo-mute)}
.reward.done{border-color:#FFC800;background:#FFFBEA}
.reward.done .re{animation:jump .8s ease-out 2}
.reward.done .rmsg{color:#B88A00}
.gbar{position:relative;height:18px;border-radius:999px;background:var(--duo-line);overflow:hidden;margin-top:6px}
.gbar i{display:block;height:100%;border-radius:999px;background:#FFC800;transition:width .4s}
.reward.fam .gbar i{background:#1CB0F6}
.gbar span{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-weight:900;color:var(--duo-ink)}
.fam-av{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.fam-av span{display:flex;align-items:center;gap:3px;font-size:20px}
.fam-av small{font-size:12px;font-weight:900;color:var(--duo-mute)}
.goal-hit{display:flex;flex-direction:column;align-items:center;gap:4px;width:100%;max-width:420px;padding:16px;border-radius:16px;background:#FFFBEA;border:2px solid #FFC800;animation:pop .5s .4s both}
.goal-hit.fam{background:var(--duo-sel);border-color:var(--duo-sel-b)}
.goal-hit .ge{font-size:52px;animation:jump .8s ease-out 3}
.goal-hit b{font-family:var(--f-display);font-size:22px;color:#B88A00}
.goal-hit.fam b{color:var(--duo-sel-t)}
.goal-hit span:last-child{font-weight:800;color:var(--duo-ink)}
.goal-edit{border-top:2px solid var(--duo-line);padding:14px 0 6px}
.goal-edit:first-of-type{border-top:0;padding-top:0}
.ge-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ge-head .pav{width:40px;height:40px;font-size:24px}

.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:44px;height:44px;border-radius:12px;background:#fff;border:2px solid var(--duo-line);box-shadow:0 3px 0 var(--duo-line);font-size:24px;font-weight:900;color:var(--nile)}

/* ---------- v3: nieuwe spelvormen, Mishmish, prijzen, editor ---------- */
button,.opt,.mitem,.tile,.node{touch-action:manipulation;-webkit-user-select:none;user-select:none}
.playrow{display:flex;align-items:center;gap:8px}
.slowbtn{width:44px;height:44px;border-radius:14px;background:#fff;border:2px solid var(--duo-line);box-shadow:0 3px 0 var(--duo-line);font-size:22px;display:grid;place-items:center}
.slowbtn:active{transform:translateY(3px);box-shadow:none}
.welcome-step{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding-top:10px}
.bubble.big{font-size:18px;font-weight:800;max-width:420px}
.bubble.big::before{display:none}
.wl-pics{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.wl-pics .pic{width:64px;height:64px;font-size:40px;display:grid;place-items:center;border:2px solid var(--duo-line);border-radius:16px;background:#fff}
.wl-pics .pic img{border-radius:14px}
.wl-plan{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.wl-plan span{padding:6px 12px;border-radius:999px;border:2px solid var(--duo-line);font-weight:900;font-size:13px;color:var(--duo-mute)}
.forms{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;margin-top:6px}
.forms>div{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px;border-radius:14px;background:var(--sand)}
.forms span{font-size:12px;font-weight:900;color:var(--duo-mute);text-transform:uppercase;letter-spacing:.04em}
.forms b{font-size:18px;color:var(--duo-sel-t)}
.chips-k{display:flex;gap:6px;margin-bottom:-6px}
.chip-k{font-size:12px;font-weight:900;padding:3px 10px;border-radius:999px;text-transform:uppercase;letter-spacing:.05em}
.chip-k.test{background:#FFF4CC;color:#B88A00}
.chip-k.rev{background:var(--duo-sel);color:var(--duo-sel-t)}
.prompt.bigpic{justify-content:center}
.prompt.bigpic .pic{width:150px;font-size:96px}
.aopts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.audopt{min-height:110px;gap:6px}
.audopt .aicon{width:48px;height:48px;color:#1CB0F6}
.audopt .aicon svg{width:100%;height:100%}
.audopt .anum{font-weight:900;color:var(--duo-mute)}
.aicon.big{width:48px;height:48px;color:#1CB0F6;display:block}
.aicon.big svg{width:100%;height:100%}
.nlopt{color:var(--duo-ink)!important}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mcol{display:flex;flex-direction:column;gap:10px}
.mitem{min-height:64px;padding:8px 10px;border-radius:14px;background:#fff;border:2px solid var(--duo-line);box-shadow:0 4px 0 var(--duo-line);font-weight:900;font-size:16px;color:var(--duo-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center}
.mitem .ar{font-size:15px;color:var(--duo-mute);font-weight:700}
.mitem.sel{background:var(--duo-sel);border-color:var(--duo-sel-b);box-shadow:0 4px 0 var(--duo-sel-b);color:var(--duo-sel-t)}
.mitem.done{background:var(--ok-bg);border-color:#A5ED6E;box-shadow:none;color:var(--ok-t);opacity:.7}
.mitem.bad{background:var(--try-bg);border-color:#FFC97A;animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.fill-line{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;font-size:22px;font-weight:900;padding:14px;border:2px solid var(--duo-line);border-radius:16px}
.fill-line .gap{min-width:90px;padding:2px 10px;border-bottom:3px solid var(--duo-sel-b);text-align:center;color:var(--duo-sel-t)}
.chat{display:flex;flex-direction:column;gap:10px}
.cmsg{display:flex;align-items:flex-end;gap:8px}
.cmsg.me{justify-content:flex-end}
.cmsg .cb{max-width:78%;padding:10px 14px;border-radius:16px;border:2px solid var(--duo-line);background:#fff;font-weight:800;display:flex;flex-direction:column;gap:2px}
.cmsg.me .cb{background:var(--ok-bg);border-color:#A5ED6E;color:var(--ok-t)}
.cmsg.now .cb b{font-size:19px;color:var(--duo-ink)}
.cmsg .cb small{color:var(--duo-mute);font-weight:700}
.cmsg .cb .ar{font-size:18px}
.cav{flex:none;font-size:26px;line-height:1}
.foot-row{display:flex;gap:10px;align-items:center}
.hintbtn{flex:none;width:56px;height:52px;border-radius:16px;background:#fff;border:2px solid var(--duo-line);box-shadow:0 4px 0 var(--duo-line);font-size:24px}
.hintbtn:active{transform:translateY(4px);box-shadow:none}
.hintbtn[disabled]{opacity:.4}
.hint-msg{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;color:var(--duo-mute)}
.world-done{display:flex;align-items:center;gap:14px;width:100%;max-width:420px;padding:14px 16px;border-radius:16px;background:var(--wc);color:#fff;text-align:left;animation:pop .5s .3s both}
.world-done .wde{font-size:46px}
.world-done b{display:block;font-family:var(--f-display);font-size:20px;color:#fff}
.world-done span{font-weight:800;font-size:14px}
.unlock{display:flex;align-items:center;gap:12px;width:100%;max-width:420px;padding:12px 16px;border-radius:16px;border:2px solid var(--duo-sel-b);background:var(--duo-sel);text-align:left}
.unlock .k{display:block;font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.05em;color:var(--duo-sel-t)}
.unlock b{font-family:var(--f-display);font-size:19px}
.new-badges{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}
.new-badges .k{font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:#B88A00}
.nb-row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.badge-big{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 14px;border-radius:16px;border:2px solid #FFC800;background:#FFFBEA;min-width:110px;animation:pop .5s .5s both}
.badge-big span{font-size:40px}
.badge-big b{font-size:14px}
.greet{display:flex;align-items:flex-end;gap:10px;margin-bottom:14px}
.greet .bubble{flex:1;min-width:0}
.greet .bubble .playwrap{display:inline-flex;vertical-align:middle;margin-left:6px}
.review-card{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 16px;border-radius:16px;margin-bottom:14px;background:#fff;border:2px solid var(--duo-sel-b);box-shadow:0 4px 0 var(--duo-sel-b)}
.review-card:active{transform:translateY(4px);box-shadow:none}
.review-card .ic{flex:none;width:52px;height:52px;border-radius:14px;background:var(--duo-sel);display:grid;place-items:center;font-size:30px}
.review-card b{display:block;font-family:var(--f-display);font-size:20px;color:var(--duo-sel-t)}
.review-card span span{font-weight:800;font-size:14px;color:var(--duo-mute)}
.review-card .go{margin-left:auto;font-size:30px;color:var(--duo-sel-t);font-weight:900}
.badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.bdg{display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;padding:12px 6px;border-radius:14px;border:2px solid #FFC800;background:#FFFBEA}
.bdg .be{font-size:34px}
.bdg b{font-size:13px;line-height:1.2}
.bdg small{font-size:11px;font-weight:700;color:var(--duo-mute)}
.bdg.locked{border-color:var(--duo-line);background:#fff}
.bdg.locked .be{filter:grayscale(1);opacity:.35}
.hist{display:flex;flex-direction:column}
.hrow{display:grid;grid-template-columns:44px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--duo-line)}
.hrow:last-child{border-bottom:0}
.hd{font-weight:900;font-size:13px;color:var(--duo-mute)}
.hrow .mid{display:flex;flex-direction:column;min-width:0}
.hrow .mid b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow .mid span{font-size:12px;font-weight:700;color:var(--duo-mute)}
.hs{font-weight:900;font-variant-numeric:tabular-nums}
.crow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--duo-line)}
.crow .ar{font-size:22px;font-weight:700}
.crow .acts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.crow .ph{font-weight:900}
.crow .nl{font-size:13px;color:var(--duo-mute);font-weight:700}
.cnote{font-size:12px;font-weight:800;color:var(--try-t);margin-top:2px}
.crow.cedit{display:block;background:var(--sand);border-radius:14px;padding:12px;margin:8px 0}
.ar-in{font-family:var(--f-ar);font-size:22px}
.miss-w{margin-bottom:12px}
.mw-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.mw-name{font-weight:900;text-align:left;padding:6px 0;color:var(--duo-ink)}
.mchip{cursor:pointer}
.mchip.rec-on{background:#FFE9E4;border-color:#FFC6B9;color:var(--coral-d)}
@media (min-width:760px){
  #app{max-width:700px}
  .nav-in{max-width:700px}
  .opt{min-height:150px}
  .opt .pic{width:110px;font-size:64px}
  .lvl1 .opt .pic{width:130px;font-size:78px}
  .wordcard .pic{width:180px;font-size:110px}
  .ex-k{font-size:28px}
  .memgrid{grid-template-columns:repeat(4,1fr);gap:14px}
}

const GRAMMAR = {
  A2: `<p><b>"Zijn" bestaat niet in de tegenwoordige tijd.</b> Je zegt gewoon <i>Ana Masri</i> = ik (ben) Egyptisch, <i>Ana Men Holanda</i> = ik (kom) uit Nederland.</p><p><b>Mannelijk en vrouwelijk.</b> Een vrouw zegt vaak het woord met <i>-a</i> erachter: <i>Modarres</i> → <i>Modarresa</i>, <i>Metgawwez</i> → <i>Metgawweza</i>. De app laat vrouwen automatisch de vrouwelijke vorm zien.</p>`,
  A3: `<p><b>"Mijn, jouw, zijn" plak je achter het woord.</b></p><p><i>Beet</i> (huis) → <i>Beeti</i> (mijn huis), <i>Beetak</i> (jouw, tegen een man), <i>Beetek</i> (jouw, tegen een vrouw), <i>Beeto</i> (zijn), <i>Beetha</i> (haar).</p><p>Zo ook: <i>Goozi</i> = mijn man, <i>Ebni</i> = mijn zoon.</p>`,
  A4: `<p><b>Tellen.</b> Na 3 tot en met 10 gebruik je het meervoud, vanaf 11 het enkelvoud. Voor 2 gebruik je vaak een eigen vorm (tweevoud) in plaats van <i>Etneen</i>.</p>`,
  A5: `<p><b>"Ik wil".</b> Een man zegt <i>3ayez</i>, een vrouw <i>3ayza</i>. Daarna komt gewoon wat je wilt: <i>3ayez Shai</i> = ik wil thee.</p>`,
  B2: `<p><b>Vraagwoorden staan vaak achteraan.</b> <i>Esmak Eeh?</i> = je naam wat? (hoe heet je?), <i>Enta Raye7 Feen?</i> = jij gaat waar? (waar ga je heen?). Je stem gaat omhoog aan het eind.</p>`,
  B5: `<p><b>Met en zonder.</b> <i>be-</i> = met: <i>Shai Be-Laban</i> (thee met melk). <i>Men Gheer</i> = zonder: <i>Men Gheer Sokkar</i> (zonder suiker).</p>`,
  C3: `<p><b>Gevoelens hebben een mannelijke en vrouwelijke vorm.</b> <i>Za3lan / Za3lana</i>, <i>Far7an / Far7ana</i>.</p><p><b>Niet.</b> Voor een bijvoeglijk naamwoord zet je <i>Mesh</i>: <i>Ana Mesh Ta3ban</i> = ik ben niet moe.</p>`,
  C5: `<p><b>Uitdrukkingen met God</b> horen bij gewone beleefdheid, ook voor wie niet gelovig is. <i>Insha'allah</i> = hopelijk, <i>Masha'allah</i> = wat mooi (bij complimenten, vooral over kinderen), <i>El-7amdo Lellah</i> = gelukkig / dank God.</p>`,
  D2: `<p><b>Opvulwoorden maken je Egyptisch natuurlijk.</b> <i>Tabb</i> (nou), <i>Ya3ni</i> (dus, zeg maar), <i>Akkeed</i> (zeker), <i>Wallahi</i> (echt waar). Egyptenaren gebruiken ze de hele dag.</p>`,
  D4: `<p><b>Werkwoorden in drie stappen:</b></p><p><i>b-</i> = nu of gewoonlijk: <i>Bakol</i> = ik eet.<br><i>h-</i> = straks: <i>Hakol</i> = ik ga eten.<br>Verleden tijd heeft een eigen vorm: <i>Kalt</i> = ik at, <i>Ro7t</i> = ik ging.</p><p><b>Ontkennen:</b> <i>Ma-…-sh</i> om het werkwoord heen: <i>Mabakolsh</i> = ik eet niet. Bij de toekomst: <i>Mesh Haroo7</i> = ik ga niet.</p>`,

/* =====================================================================
   CENTRALE SCHRIJFWIJZE (transliteratie) VAN HET EGYPTISCH
   Elke uitspraak in de app gaat door translit(uitspraak, arabisch).
   Regels:
   - Ieder woord begint met een hoofdletter (ook na een koppelteken: El-Kheer).
   - ع = 3, ح = 7, خ = Kh, ش = Sh, غ = Gh, ء/ق (als glottisslag) = '
   - Klinkers: lange a = a, lange i (ي) = ee, oe = o (of oo bij een و), ee en oo blijven.
   - Nederlandse spelling wordt omgezet: sj→sh, ch→kh, j→y.
   3 en 7 worden bepaald door het Arabische schrift ernaast: de app zoekt de ع, ح en ه
   in het Arabisch en zet de ' en h in dezelfde volgorde om. Klopt het aantal niet,
   dan blijft het teken staan en wordt het woord gemarkeerd om te controleren.
   De functie is veilig om vaker uit te voeren: al omgezette tekst blijft gelijk.
   ===================================================================== */
const TL_MANUAL = {
  'mieet geneeh':'Meet Geneeh',
  "ma'as-salaama":'Ma3a Salama',
  'bahebbik':'Ba7ebbek',
  'bahebbik ja mama':'Ba7ebbek Ya Mama',
};   // vaste uitzonderingen: oude of nieuwe uitspraak (kleine letters) -> gewenste schrijfwijze
function tlArabic(ar){
  const s = String(ar||'').replace(/[ً-ٰٟـ]/g,'').replace(/[،؟!?.,:;"()]/g,'');
  const H = [], A = [];
  s.split(/\s+/).forEach(w=>{
    [...w].forEach((c,i)=>{
      const last = i===w.length-1;
      if(c==='ح') H.push({v:'7'}); else if(c==='ه') H.push({v:'h', fin:last, short:w.length<=3});
      if(c==='ع') A.push({v:'3'}); else if(c==='ق') A.push({v:"'", q:1});
      else if('ءؤئ'.includes(c) || ('أإآ'.includes(c) && i>0)) A.push({v:"'", hz:1});
    });
  });
  return {H, A};
}
function tlTokens(s){
  const H = [], A = [];
  for(let i=0;i<s.length;i++){
    const two = s.slice(i,i+2);
    if(two==='sh' || two==='kh' || two==='gh'){ i++; continue; }
    if((s[i]==='h' && s[i+1]==='h') || (s[i]==='7' && s[i+1]==='7')){ H.push([i,i+1]); i++; continue; }
    if(s[i]==='h' || s[i]==='7') H.push([i]);
    else if(s[i]==="'" || s[i]==='3') A.push([i]);
  }
  return {H, A};
}
function tlFit(lat, ar, drops){
  if(lat.length===ar.length) return ar;
  for(const d of drops){ const r = ar.filter(x=>!d(x)); if(r.length===lat.length) return r; }
  return null;
}
function translit(ph, ar, issues){
  if(!ph) return ph;
  const raw = String(ph).trim();
  const key = raw.toLowerCase();
  if(TL_MANUAL[key]) return TL_MANUAL[key];
  let s = key;
  const arW = String(ar||'').trim().split(/\s+/), laW = s.split(' ');
  // oe -> oo voor zoveel keer als er een و (als klinker) in het Arabische woord staat (de laatste), anders o
  s = laW.map((w,k)=>{ const a = arW.length===laW.length ? arW[k] : ''; let n = [...a].filter((c,i)=>c==='و' && i>0).length;
    const idx = []; w.replace(/oe/g, (m,i)=>{ idx.push(i); return m; });
    const longSet = new Set(idx.slice(Math.max(0, idx.length-n)));
    return w.replace(/oe/g, (m,i)=> longSet.has(i) ? 'oo' : 'o'); }).join(' ');
  s = s.replace(/sj/g,'sh').replace(/ch/g,'kh').replace(/aa/g,'a').replace(/ii/g,'ee').replace(/ie/g,'ee').replace(/j/g,'y');
  // 3 / 7 via het Arabisch: per woord als het aantal woorden gelijk is, anders over de hele zin
  const conv = (lat, a, iss) => {
    const t = tlTokens(lat), g = tlArabic(a), out = lat.split('');
    const H = tlFit(t.H, g.H, [x=>x.v==='h'&&x.fin&&x.short, x=>x.v==='h'&&x.fin]);
    if(H) t.H.forEach((ps,k)=>ps.forEach(p=>{ out[p] = H[k].v; })); else iss.push('h/7');
    const A = tlFit(t.A, g.A, [x=>x.q, x=>x.hz, x=>x.q||x.hz]);
    if(A) t.A.forEach((ps,k)=>ps.forEach(p=>{ out[p] = A[k].v; })); else iss.push("'/3");
    return out.join('');
  };
  const aw = String(ar||'').trim().split(/\s+/), lw = s.split(' ');
  const iss = [];
  if(aw.length===lw.length){ const per = lw.map((w,k)=>{ const i2=[]; const r = conv(w, aw[k], i2); i2.forEach(x=>iss.push(x+' in '+w)); return {r, ok:!i2.length}; });
    if(per.every(x=>x.ok)) s = per.map(x=>x.r).join(' ');
    else { const i3 = []; const whole = conv(s, ar, i3); if(!i3.length){ s = whole; iss.length = 0; } else s = per.map(x=>x.r).join(' '); } }
  else s = conv(s, ar, iss);
  if(issues) iss.forEach(x=>issues.push(x));
  // hoofdletters: ieder woord en na een koppelteken
  s = s.replace(/(^|[\s\-])([^a-z0-9\s\-]*)([a-z])/g, (m,a,b,c)=>a+b+c.toUpperCase());
  return s;
}

function dropAudio(id){ if(ABLOB[id]){ try{ URL.revokeObjectURL(ABLOB[id].url); }catch(e){} delete ABLOB[id]; } }
async function warm(id){
  const src = MEDIA.audio[id] || MEDIA.shared[id]; if(!src) return;
  const k = akey(id); if(ABLOB[id] && ABLOB[id].v===k.v) return;
  const c = await acache(), key = k.base + '?v=' + encodeURIComponent(k.v);

  }

function warmMany(ids, first){

async function shrinkImage(file, max=480){
  const url = URL.createObjectURL(file);

    const img = await new Promise((res,rej)=>{ const i = new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; });
    const side = Math.min(img.naturalWidth, img.naturalHeight), out = Math.min(max, side);
    const c = document.createElement('canvas'); c.width = c.height = out;
    c.getContext('2d').drawImage(img, (img.naturalWidth-side)/2, (img.naturalHeight-side)/2, side, side, 0, 0, out, out);
    return await new Promise(res=>c.toBlob(b=>res(b), 'image/jpeg', .82));
  } finally { URL.revokeObjectURL(url); }
}

const BOX_DAYS = [0,1,2,4,7,14];
